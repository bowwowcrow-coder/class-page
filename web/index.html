<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쉅</title>
<meta name="description" content="인천디자인고등학교 수업 페이지 · 공지 · 자료 · 과제 제출 · 설문">
<meta property="og:type" content="website">
<meta property="og:title" content="수업 페이지">
<meta property="og:description" content="인천디자인고등학교 · 공지 · 자료 · 과제 제출 · 설문">
<meta property="og:image" content="https://total-page.pages.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://total-page.pages.dev/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="쉅">
<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #f5f5f7; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  @media (prefers-color-scheme: dark) { html, body { background: #000; color: #f5f5f7; } }
  .splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .splash img { width: 72px; height: 72px; border-radius: 18px; }
  .spin { width: 26px; height: 26px; border: 3px solid rgba(128,128,128,.25); border-top-color: #0071e3; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .err { max-width: 300px; padding: 0 16px; text-align: center; font-size: 15px; line-height: 1.5; }
  .err button { margin-top: 12px; height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: #0071e3; color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<div class="splash" id="splash"><img src="/icon-192.png" alt=""><div class="spin" role="status" aria-label="불러오는 중"></div></div>
<script>
(function () {
  // 실제 데이터는 구글 시트(Apps Script)에 그대로 있다. 이 페이지는 화면을 받아 와서 띄우고, 버튼 동작을 그쪽으로 넘겨준다.
  var API = 'https://script.google.com/macros/s/AKfycbyw6oiaICnnbyw2l0xVsVCJ0VBI1lz4mQM3N9BpNOs7p0edgAV9dcWNKQxMNTMhIdVykw/exec';
  // 화면 코드가 쓰던 google.script.run 을 그대로 흉내 낸다
  var shim = '<script>(function(){var API=' + JSON.stringify(API) + ';' +
    'function mk(ok,fail){var o={withSuccessHandler:function(f){return mk(f,fail)},withFailureHandler:function(f){return mk(ok,f)}};' +
    'return new Proxy(o,{get:function(t,k){if(k in t)return t[k];return function(){var args=[].slice.call(arguments);' +
    'fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:k,args:args})})' +
    '.then(function(r){return r.json()}).then(function(r){if(r.err!==undefined){fail&&fail(new Error(r.err))}else{ok&&ok(r.v)}})' +
    '.catch(function(e){fail&&fail(new Error("연결이 끊겼습니다. 인터넷을 확인하고 다시 시도해 주세요."))})}}})}' +
    'window.google={script:{run:mk(null,null)}};})();<\/script>';
  var head = '<meta name="viewport" content="width=device-width, initial-scale=1"><title>쉅</title>' +
    '<meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="쉅">' +
    '<link rel="icon" type="image/png" href="/favicon-64.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest">';
  function fail() {
    var s = document.getElementById('splash');
    s.innerHTML = '<div class="err">화면을 불러오지 못했어요.<br>인터넷 연결을 확인해 주세요.<br><button type="button">다시 시도</button></div>';
    s.querySelector('button').onclick = function () { location.reload(); };
  }
  fetch(API + '?raw=1').then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (html) {
    if (html.indexOf('<head>') < 0) throw new Error('bad');
    html = html.replace('<head>', '<head>' + head + shim).replace('<base target="_top">', '');
    document.open(); document.write(html); document.close();
  }).catch(fail);
})();
</script>
</body>
</html>
