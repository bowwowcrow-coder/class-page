<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon-64.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바이브코딩 실습 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 상단 60분 타임 눈금자 + 세로 단계 카드. 트랙(게임/웹)에 따라 강조색만 바뀜 */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#18212B; --sub:#5B6774; --line:#D3DAE2;
  --game:#C8325F; --web:#2856D8; --acc:var(--game); --accSoft:#F8E3EA;
  --ok:#1F8A5B; --code:#F4F6F9;
  --fDisp:"Black Han Sans","Apple SD Gothic Neo",sans-serif;
  --fBody:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fMono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171D; --panel:#1A2129; --ink:#E6EBF0; --sub:#93A0AD; --line:#2C3640;
  --game:#F0668F; --web:#6F93FF; --accSoft:#3A1F29; --ok:#4CC28C; --code:#141A20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171D; --panel:#1A2129; --ink:#E6EBF0; --sub:#93A0AD; --line:#2C3640;
  --game:#F0668F; --web:#6F93FF; --accSoft:#3A1F29; --ok:#4CC28C; --code:#141A20; color-scheme:dark}
body.web{--acc:var(--web)}
body.web{--accSoft:#E1E8FB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.web{--accSoft:#1D2747}}
:root[data-theme="dark"] body.web{--accSoft:#1D2747}

body{background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--fBody);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font:400 clamp(30px,6vw,44px)/1.05 var(--fDisp);letter-spacing:-.5px}
.top h1 span{color:var(--acc)}
.top p{margin:6px 0 0;color:var(--sub)}
.eyebrow{font:600 11px/1 var(--fMono);letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tk{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.tk b{font:400 22px/1.2 var(--fDisp)}
.tk small{color:var(--sub);font-size:13px}
.tk:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tk[aria-pressed="true"]{border-color:var(--acc);background:var(--accSoft)}
.tk[aria-pressed="true"] b{color:var(--acc)}

.idea{display:flex;flex-direction:column;gap:12px}
.idea h2{font:700 17px/1.3 var(--fBody)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub);min-width:0}
.fields input{font:500 15px/1.4 var(--fBody);color:var(--ink);background:var(--code);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
.fields input:focus{outline:2px solid var(--acc);border-color:transparent}
.ex{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ex span{font-size:12px;color:var(--sub);margin-right:2px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.chip:hover,.chip:focus-visible{border-color:var(--acc);color:var(--acc)}

/* 60분 눈금자 */
.ruler{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.rhead b{font:600 13px/1 var(--fMono)}
.rhead b em{font-style:normal;color:var(--acc)}
.bar{display:flex;gap:3px;height:26px}
.seg{all:unset;cursor:pointer;position:relative;border-radius:4px;background:var(--code);border:1px solid var(--line);overflow:hidden;min-width:0}
.seg i{position:absolute;inset:0;background:var(--acc);transform-origin:left;transform:scaleX(0);transition:transform .3s}
.seg.done i{transform:scaleX(1)}
.seg.part i{transform:scaleX(var(--p,0));opacity:.55}
.seg span{position:relative;font:600 11px/26px var(--fMono);padding-left:6px;white-space:nowrap;color:var(--sub)}
.seg.done span{color:#fff}
.seg:focus-visible{outline:2px solid var(--acc)}
.ticks{display:flex;justify-content:space-between;font:400 10px/1 var(--fMono);color:var(--sub);margin-top:5px;font-variant-numeric:tabular-nums}

/* 단계 */
.steps{display:flex;flex-direction:column;gap:14px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;scroll-margin-top:110px}
.step.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.shead{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px;cursor:pointer}
.num{font:400 28px/1 var(--fDisp);color:var(--acc);min-width:28px}
.step.ok .num{color:var(--ok)}
.shead h3{font:700 17px/1.35 var(--fBody)}
.shead .goal{font-size:13px;color:var(--sub);margin-top:2px}
.time{font:600 12px/1 var(--fMono);color:var(--sub);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.time .st{display:block;margin-top:6px;font-size:11px;color:var(--ok)}
.sbody{padding:0 18px 18px 60px;display:flex;flex-direction:column;gap:14px}
.step:not(.open) .sbody{display:none}
.why{margin:0;color:var(--sub);font-size:14px;max-width:62ch}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.todo input{margin-top:5px;accent-color:var(--acc);width:17px;height:17px;flex-shrink:0}
.todo input:checked+span{color:var(--sub);text-decoration:line-through}
.prompt{border:1px solid var(--line);border-radius:8px;background:var(--code);overflow:hidden}
.ptop{display:flex;justify-content:space-between;align-items:center;padding:7px 10px 7px 12px;border-bottom:1px solid var(--line)}
.copy{all:unset;cursor:pointer;font:600 12px/1 var(--fBody);padding:6px 10px;border-radius:5px;background:var(--acc);color:#fff}
.copy:focus-visible{outline:2px solid var(--ink)}
.copy.did{background:var(--ok)}
.prompt pre{margin:0;padding:12px;font:400 13px/1.7 var(--fMono);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.prompt pre mark{background:var(--accSoft);color:var(--acc);border-radius:3px;padding:0 2px;font-weight:600}
.tip{font-size:13.5px;border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--sub);max-width:62ch}
.tip b{color:var(--ink)}

.sos h2{font:400 22px/1.2 var(--fDisp);margin-bottom:10px}
.sosl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sosl details{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--code);min-width:0}
.sosl summary{cursor:pointer;font-weight:700;font-size:14px}
.sosl details p{margin:8px 0 6px;font-size:13.5px;color:var(--sub)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--sub);font-size:13px}
.reset{all:unset;cursor:pointer;text-decoration:underline}
.reset.arm{color:var(--game);font-weight:700}

@media (max-width:640px){
  .fields{grid-template-columns:1fr}
  .sbody{padding-left:18px}
  .sosl{grid-template-columns:1fr}
  .seg span{display:none}
  .tk b{font-size:19px}
}

.gate{display:flex;flex-direction:column;gap:14px}
.gate h2{font:400 24px/1.2 var(--fDisp)}
.gate p{margin:0;color:var(--sub);font-size:14px;max-width:60ch}
.grow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gate label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub);min-width:0}
.gate input{font:500 16px/1.4 var(--fBody);color:var(--ink);background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0;font-variant-numeric:tabular-nums}
.gate input:focus{outline:2px solid var(--acc);border-color:transparent}
.gbtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{all:unset;cursor:pointer;font:700 15px/1 var(--fBody);padding:12px 18px;border-radius:8px;background:var(--acc);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.ghost:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ghost{all:unset;cursor:pointer;font-size:13px;color:var(--sub);text-decoration:underline}
.gmsg{font-size:13.5px;color:var(--game);min-height:1em}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 8px 6px 14px}
.who b{color:var(--ink);font-weight:700}
.who .sv{font:600 12px/1 var(--fMono)}
.who .sv.bad{color:var(--game)}
.who .ghost{padding:0 6px}
@media (max-width:640px){.grow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">방과후 · 바이브코딩 실습 · 60분</div>
      <h1>AI랑 <span id="ttl">게임</span> 만들기</h1>
      <p>ChatGPT에게 말로 시키고, 실행해 보고, 고쳐 달라고 하는 걸 한 시간 동안 여섯 번 반복합니다.</p>
    </div>
    <div class="who" id="who" hidden></div>
  </header>

  <section class="panel gate" id="gate" aria-labelledby="gateH">
    <h2 id="gateH">수업 페이지 계정으로 로그인</h2>
    <p>로그인하면 진행 상황이 저장돼서 다른 노트북에서 열어도 이어서 할 수 있어요. 수업 페이지와 같은 학번·이름·PIN이에요.</p>
    <div class="grow" id="gStep1">
      <label for="gId">학번<input id="gId" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="예: 30403"></label>
      <label for="gName">이름<input id="gName" autocomplete="off" placeholder="예: 홍길동"></label>
    </div>
    <div class="grow" id="gStepPin" hidden>
      <label for="gPin">PIN (숫자 4자리)<input id="gPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>
    </div>
    <div class="grow" id="gStepSetup" hidden>
      <label for="gCode">휴대폰 번호 뒤 4자리<input id="gCode" inputmode="numeric" maxlength="4" autocomplete="off"></label>
      <label for="gNew">새로 정할 PIN (숫자 4자리)<input id="gNew" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>
    </div>
    <div class="gmsg" id="gMsg" role="status"></div>
    <div class="gbtns">
      <button class="btn" id="gGo">다음</button>
      <button class="ghost" id="gBack" hidden>학번 다시 입력</button>
      <button class="ghost" id="gGuest">로그인 없이 하기 (이 노트북에만 저장)</button>
    </div>
  </section>

  <div id="main" hidden style="display:contents">

  <div class="tracks" role="group" aria-label="만들 것 고르기">
    <button class="tk" id="tk-game" data-t="game" aria-pressed="true"><b>게임</b><small>탭·클릭으로 하는 한 화면 게임</small></button>
    <button class="tk" id="tk-web" data-t="web" aria-pressed="false"><b>웹페이지</b><small>소개·도감·포트폴리오 같은 한 장짜리 사이트</small></button>
  </div>

  <section class="panel idea" aria-labelledby="ideaH">
    <h2 id="ideaH">내 아이디어 세 칸만 채우기</h2>
    <div class="fields" id="fields"></div>
    <div class="ex" id="examples"></div>
  </section>

  <div class="ruler" aria-label="진행 상황">
    <div class="rhead"><span class="eyebrow">진행</span><b><em id="pct">0</em> / <span id="tot">0</span> 완료</b></div>
    <div class="bar" id="bar"></div>
    <div class="ticks"><span>0분</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60분</span></div>
  </div>

  <div class="steps" id="steps"></div>

  <section class="panel sos" aria-labelledby="sosH">
    <h2 id="sosH">막혔을 때</h2>
    <div class="sosl" id="sos"></div>
  </section>

  </div>
  <div class="foot">
    <span id="footNote">체크한 내용은 이 기기에만 저장돼요.</span>
    <button class="reset" id="reset">처음부터 다시</button>
  </div>
</div>

<script>
var DATA={
 game:{
  name:"게임",
  fields:[["a","무슨 게임?","예: 떨어지는 과일 받기"],["b","조작은?","예: 좌우 화살표 / 화면 터치"],["c","언제 끝나?","예: 3개 놓치면 게임오버"]],
  examples:[
   ["과일 받기",["떨어지는 과일을 바구니로 받는 게임","좌우 화살표, 폰은 화면 왼쪽·오른쪽 터치","과일 3개 놓치면 게임오버"]],
   ["색 찾기",["16칸 중 색이 살짝 다른 한 칸 찾기","칸을 클릭·터치","30초 안에 몇 개 찾는지"]],
   ["반응속도",["화면이 초록으로 바뀌는 순간 누르기","아무 데나 클릭·터치","5번 평균 반응속도 기록"]],
   ["운석 피하기",["위에서 내려오는 운석 피하기","마우스나 손가락으로 우주선 이동","부딪히면 끝, 버틴 시간이 점수"]]
  ],
  steps:[
   {t:"아이디어를 한 문장으로",m:[0,5],goal:"누가, 뭘 하고, 언제 끝나는지",
    why:"ChatGPT는 애매하게 말하면 애매하게 만들어요. 위의 세 칸을 채우면 다음 단계 요청문이 자동으로 완성됩니다.",
    todo:["위의 세 칸 채우기","옆 사람한테 10초 안에 설명해 보기"],
    tip:"<b>욕심은 나중에.</b> 캐릭터, 스토리, 레벨 10개는 지금 넣지 마세요. 한 시간 안에 '돌아가는 것'이 먼저예요."},
   {t:"제일 작은 버전 만들기",m:[5,15],goal:"조작 하나, 화면 하나",
    why:"처음부터 다 시키면 어디가 고장 났는지 못 찾아요. 움직이기만 하는 상태를 먼저 받습니다.",
    prompt:"HTML 파일 하나로 브라우저에서 바로 실행되는 간단한 게임을 만들어 줘.\n게임: {a}\n조작: {b}\n끝나는 조건: {c}\n\n지금은 점수, 효과음, 꾸미기 없이 기본 동작만 되게 해 줘.\nPC와 폰 둘 다에서 조작할 수 있게 해 줘.\n캔버스로 열어서 미리보기로 바로 해 볼 수 있게 해 줘.",
    todo:["요청문 복사해서 ChatGPT에게 보내기","캔버스 오른쪽 위 미리보기로 실행하기","직접 한 판 해 보기"],
    tip:"<b>코드만 길게 나오고 캔버스가 안 열리면</b> \"이 코드 캔버스로 열어 줘\"라고 한 번 더 말하세요."},
   {t:"실행해 보고 고장 고치기",m:[15,25],goal:"이상한 점을 그대로 말하기",
    why:"버그는 당연히 나와요. 고치는 요령은 '본 것'을 그대로 전달하는 겁니다. 추측해서 말하지 않기.",
    prompt:"해 보니까 이렇게 돼: [본 것 그대로 적기]\n내가 원하는 건: [원래 되어야 하는 모습]\n다른 부분은 건드리지 말고 이것만 고쳐 줘.",
    todo:["이상한 점 하나 찾기","[ ] 부분 채워서 보내기","고쳐졌는지 다시 해 보기"],
    tip:"<b>빨간 오류 글자가 보이면</b> 그 글자를 통째로 복사해서 붙여 넣는 게 제일 빨라요."},
   {t:"재미 하나씩 더하기",m:[25,40],goal:"한 번에 기능 하나",
    why:"점수 → 시간 제한 → 점점 빨라지기 순으로, 하나 넣고 해 보고, 또 하나 넣습니다.",
    prompt:"지금 게임에 이것 하나만 추가해 줘: [점수 표시 / 제한 시간 / 점점 어려워지기 / 최고 기록 저장]\n추가한 다음에도 기존 조작은 그대로 되게 해 줘.",
    todo:["점수 넣기","다시 시작 버튼 넣기","하나 더 골라서 넣기"],
    tip:"<b>한 번에 세 개 시키면</b> 셋 다 어설프게 나와요. 꼭 하나씩."},
   {t:"디자이너답게 꾸미기",m:[40,50],goal:"색·글꼴·느낌을 구체적으로",

  $("footNote").textContent="진행 상황은 내 계정에 저장돼서 다른 노트북에서도 이어져요."}
 function summary(){var parts=[],tr={game:"게임",web:"웹"};
  ["game","web"].forEach(function(t){var st=DATA[t].steps,done=0,any=0;st.forEach(function(x,i){var n=x.todo.filter(function(_,j){return S.c[t][i+"-"+j]}).length;if(n)any=1;if(n===x.todo.length)done++});if(any||t===S.t)parts.push(tr[t]+" "+done+"/"+st.length+"단계")});
  return {track:tr[S.t],progress:parts.join(" · ")}}
 function push(){if(!tok)return;if(saving){again=true;return}saving=true;chip("저장 중…");
  call("apiVibeSave",tok,S,summary()).then(function(r){saving=false;
    if(r&&r.ok){chip("저장됨 "+r.time)}else if(r&&r.expired){expire()}else{chip("저장 실패 · 다시 시도 중");setTimeout(push,4000)}
    if(again){again=false;push()}})
  .catch(function(){saving=false;chip("bad");$("wState").textContent="연결 끊김 · 다시 시도 중";setTimeout(push,5000)})}
 window.vibeSync=function(){if(!tok)return;clearTimeout(timer);chip("저장 대기…");timer=setTimeout(push,1200)};
 function apply(data){if(data&&data.f&&data.c){S=Object.assign({t:"game",f:{game:{},web:{}},c:{game:{},web:{}},open:{game:0,web:0}},data);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderAll()}}
 function enter(token,who,data,fresh){tok=token;me=who;p(TK,token);p(GK,null);
  if(data)apply(data);else{S={t:S.t,f:{game:{},web:{}},c:{game:{},web:{}},open:{game:0,web:0}};renderAll();push()}
  show(true);chip(data?"불러옴":"새로 시작")}
 function expire(){tok=null;p(TK,null);var keep=me;me=null;mode="";reset1();if(keep){$("gId").value=keep.id;$("gName").value=keep.name}
  show(false);$("who").hidden=true;msg("로그인 시간이 지났어요. 다시 로그인하면 이어서 저장돼요.")}
 function reset1(){mode="";$("gStepPin").hidden=true;$("gStepSetup").hidden=true;$("gBack").hidden=true;$("gId").disabled=false;$("gName").disabled=false;busy(false)}
 function step1(){var id=$("gId").value.replace(/\D/g,""),name=$("gName").value.replace(/\s+/g,"");
  if(id.length!==5||!name){msg("학번 5자리와 이름을 입력해 주세요.");return}
  busy(true);msg("");call("apiCheckStudent",id,name).then(function(r){busy(false);
   if(!r.ok){msg(r.error);return}
   mode=r.mode;me={id:id,name:r.name||name};$("gId").disabled=true;$("gName").disabled=true;$("gBack").hidden=false;
   if(mode==="login"){$("gStepPin").hidden=false;$("gPin").value="";$("gPin").focus()}else{$("gStepSetup").hidden=false;$("gCode").focus();msg("처음이라 PIN을 만들어야 해요. 수업 페이지에서도 이 PIN을 써요.")}
   busy(false)}).catch(function(e){busy(false);msg("연결이 안 돼요. 인터넷을 확인하고 다시 눌러 주세요.")})}
 function step2(){var who=me,pr;
  if(mode==="login"){var pin=$("gPin").value.trim();if(!/^\d{4}$/.test(pin)){msg("PIN 숫자 4자리를 입력해 주세요.");return}pr=call("apiLogin",who.id,who.name,pin)}
  else{var code=$("gCode").value.replace(/\D/g,""),np=$("gNew").value.trim();if(code.length!==4||!/^\d{4}$/.test(np)){msg("휴대폰 번호 뒤 4자리와 새 PIN 4자리를 입력해 주세요.");return}pr=call("apiSetupPin",who.id,who.name,code,np)}
  busy(true);msg("");
  pr.then(function(r){if(!r.ok){busy(false);msg(r.error);return}var t=r.token;
    return call("apiVibeLoad",t).then(function(v){busy(false);if(!v.ok){msg(v.error);return}enter(t,{id:v.id,name:v.name},v.data)})})
  .catch(function(){busy(false);msg("연결이 안 돼요. 인터넷을 확인하고 다시 눌러 주세요.")})}
 $("gGo").addEventListener("click",function(){mode?step2():step1()});
 ["gId","gName","gPin","gCode","gNew"].forEach(function(id){$(id).addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();$("gGo").click()}})});
 $("gBack").addEventListener("click",function(){me=null;reset1();msg("");$("gId").focus()});
 $("gGuest").addEventListener("click",function(){p(GK,"1");tok=null;me=null;show(true);chip()});
 document.addEventListener("click",function(e){
  if(e.target.id==="wOut"){if(tok)call("apiLogout",tok).catch(function(){});tok=null;me=null;p(TK,null);
   S={t:"game",f:{game:{},web:{}},c:{game:{},web:{}},open:{game:0,web:0}};try{localStorage.removeItem(KEY)}catch(x){}renderAll();reset1();$("gId").value="";$("gName").value="";msg("로그아웃했어요.");show(false);$("who").hidden=true}
  if(e.target.id==="wLogin"){p(GK,null);reset1();msg("");show(false);$("who").hidden=true}});
 /* 시작: 저장된 로그인 → 불러오기, 아니면 로그인 화면 */
 try{var w=JSON.parse(g("cls_who")||"null");if(w&&w.id){$("gId").value=w.id;$("gName").value=w.name||""}}catch(e){}
 var t0=g(TK);
 if(t0){show(false);msg("불러오는 중…");call("apiVibeLoad",t0).then(function(v){msg("");if(v&&v.ok)enter(t0,{id:v.id,name:v.name},v.data);else{p(TK,null)}}).catch(function(){msg("연결이 안 돼요. 새로고침해 주세요.")})}
 else if(g(GK)){show(true);chip()}
 else show(false);
})();
</script>
