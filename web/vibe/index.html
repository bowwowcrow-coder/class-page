<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바이브코딩 실습 가이드</title>
<link rel="icon" href="/favicon-64.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 한 화면에 한 단계. 위에는 60분 눈금자, 아래에는 이전/다음. 회차(게임/웹)에 따라 강조색만 바뀜 */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#18212B; --sub:#5B6774; --line:#D3DAE2;
  --game:#C8325F; --web:#2856D8; --acc:var(--game); --accSoft:#F8E3EA;
  --ok:#1F8A5B; --code:#F4F6F9;
  --fDisp:"Black Han Sans","Apple SD Gothic Neo",sans-serif;
  --fBody:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fMono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171D; --panel:#1A2129; --ink:#E6EBF0; --sub:#93A0AD; --line:#2C3640;
  --game:#F0668F; --web:#6F93FF; --accSoft:#3A1F29; --ok:#4CC28C; --code:#141A20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171D; --panel:#1A2129; --ink:#E6EBF0; --sub:#93A0AD; --line:#2C3640;
  --game:#F0668F; --web:#6F93FF; --accSoft:#3A1F29; --ok:#4CC28C; --code:#141A20; color-scheme:dark}
body.web{--acc:var(--web);--accSoft:#E1E8FB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.web{--accSoft:#1D2747}}
:root[data-theme="dark"] body.web{--accSoft:#1D2747}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--fBody);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font:600 11px/1 var(--fMono);letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
button{font-family:inherit}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font:700 15px/1 var(--fBody);padding:14px 20px;border-radius:8px;background:var(--acc);color:#fff;text-align:center}
.btn[disabled]{opacity:.45;cursor:default}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.ghost{all:unset;cursor:pointer;font-size:13px;color:var(--sub);text-decoration:underline}
.btn:focus-visible,.ghost:focus-visible,.chip:focus-visible,.seg:focus-visible,.copy:focus-visible,.trk:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* 화면 전환 */
.screen{animation:in .28s ease both}
.screen.back{animation-name:inBack}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}

/* 로그인 */
.gate{display:flex;flex-direction:column;gap:14px}
.gate h2{font:400 24px/1.2 var(--fDisp)}
.gate p{color:var(--sub);font-size:14px;max-width:60ch}
.grow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--sub);min-width:0}
label.f input{font:500 16px/1.4 var(--fBody);color:var(--ink);background:var(--code);border:1px solid var(--line);border-radius:6px;padding:11px 12px;min-width:0;width:100%}
label.f input:focus{outline:2px solid var(--acc);border-color:transparent}
.gbtns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.gmsg{font-size:13.5px;color:var(--game);min-height:1em}

/* 처음 화면 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:18px;align-items:end}
.hero h1{font:400 clamp(30px,6.4vw,46px)/1.08 var(--fDisp);letter-spacing:-.5px;margin-top:8px}
.hero p{color:var(--sub);margin-top:8px;max-width:46ch}
.demo{width:180px;height:150px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:block;max-width:100%}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.who b{color:var(--ink)}
.who .sv{font:600 12px/1 var(--fMono)}
.who .sv.bad{color:var(--game)}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trk{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.trk:hover{border-color:var(--c)}
.trk .no{font:600 12px/1 var(--fMono);color:var(--c)}
.trk h2{font:400 24px/1.15 var(--fDisp)}
.trk p{font-size:14px;color:var(--sub)}
.mini{display:flex;gap:3px;height:6px}
.mini i{flex:1;border-radius:2px;background:var(--line)}
.mini i.on{background:var(--c)}
.trk .go{font:700 14px/1 var(--fBody);color:var(--c);margin-top:auto}
.trk.game{--c:var(--game)} .trk.web{--c:var(--web)}

/* 단계 화면 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 9px;display:flex;flex-direction:column;gap:8px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brow .where{font:600 13px/1.2 var(--fBody);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .where b{color:var(--acc);font-family:var(--fMono)}
.sosbtn{all:unset;cursor:pointer;font:700 13px/1 var(--fBody);color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:7px 12px;white-space:nowrap}
.sosbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.segs{display:flex;gap:3px;height:22px}
.seg{all:unset;box-sizing:border-box;position:relative;border-radius:4px;background:var(--code);border:1px solid var(--line);overflow:hidden;min-width:0;cursor:default}
.seg.can{cursor:pointer}
.seg.done{background:var(--acc);border-color:var(--acc)}
.seg.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.seg span{position:relative;font:600 10.5px/20px var(--fMono);padding-left:6px;white-space:nowrap;color:var(--sub)}
.seg.done span{color:#fff}
.ticks{display:flex;justify-content:space-between;font:400 10px/1 var(--fMono);color:var(--sub);font-variant-numeric:tabular-nums}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:18px}
.shead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.num{font:400 44px/0.9 var(--fDisp);color:var(--acc)}
.shead h2{font:700 21px/1.3 var(--fBody)}
.shead .goal{font-size:14px;color:var(--sub);margin-top:3px}
.time{font:600 12px/1.4 var(--fMono);color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:4px}
.txt{color:var(--ink);max-width:62ch}
.prompt{border:1px solid var(--line);border-radius:8px;background:var(--code);overflow:hidden}
.prompt.opt{border-style:dashed}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line)}
.ptop .pl{font:700 13px/1.3 var(--fBody);min-width:0}
.ptop .pl small{font-weight:400;color:var(--sub);margin-left:4px}
.copy{all:unset;cursor:pointer;font:700 12px/1 var(--fBody);padding:7px 11px;border-radius:5px;background:var(--acc);color:#fff;white-space:nowrap}
.copy.did{background:var(--ok)}
.prompt pre{margin:0;padding:12px;font:400 13px/1.7 var(--fMono);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.prompt pre mark{background:var(--accSoft);color:var(--acc);border-radius:3px;padding:0 2px;font-weight:600}
.pchk{display:flex;gap:9px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
input[type=checkbox]{margin:4px 0 0;accent-color:var(--acc);width:18px;height:18px;flex-shrink:0}
.pchk input{margin:0}
.todo input:checked+span{color:var(--sub);text-decoration:line-through}
.todo .auto{font-size:12px;color:var(--sub);margin-left:6px}
.tip{font-size:13.5px;border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--sub);max-width:62ch}
.tip b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:14px;padding:7px 13px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.lbl{font-size:13px;color:var(--sub);margin-bottom:6px}
.fixes{display:flex;flex-direction:column;gap:8px}
.badge{display:inline-block;margin-top:8px;font:600 12px/1 var(--fBody);padding:5px 9px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.badge.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sostx{margin:8px 0 0;font-size:14px;color:var(--sub)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.swc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--code);min-width:0}
.swc:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.swc i{width:22px;height:22px;border-radius:4px;border:1px solid var(--line);flex-shrink:0}
.swc span{display:flex;flex-direction:column;font-size:12px;line-height:1.3;min-width:0}
.swc b{font:600 11.5px/1.3 var(--fMono)}
.fixes details{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--code)}
.fixes summary{cursor:pointer;font-weight:700;font-size:14px}
.fixes details .prompt{margin-top:10px;background:var(--panel)}
.prev{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--code);font-size:14px}
.prev a{color:var(--acc);font-weight:700;word-break:break-all}

.nav{position:sticky;bottom:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.nav .btn{flex:1}
.nav .btn.line{flex:0 0 auto}
.left{flex:0 0 100%;font-size:12.5px;color:var(--sub);text-align:center}

/* 막혔을 때 */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--panel);width:100%;max-width:760px;max-height:84vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font:400 22px/1.2 var(--fDisp)}
.sheet .x{align-self:flex-end}

.done{text-align:left;display:flex;flex-direction:column;gap:14px}
.done h2{font:400 30px/1.15 var(--fDisp);color:var(--acc)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--sub);font-size:12.5px}

@media (max-width:640px){
  .grow,.tracks{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .demo{width:100%;height:120px}
  .seg span{display:none}
  .card{padding:18px}
  .num{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="game">
<div class="wrap" id="app">

  <section class="panel gate screen" id="gate" aria-labelledby="gateH">
    <div class="eyebrow">방과후 · 바이브코딩 실습</div>
    <h2 id="gateH">수업 페이지 계정으로 로그인</h2>
    <p>로그인하면 진행 상황이 저장돼서 다른 노트북에서 열어도 이어서 할 수 있어요. 수업 페이지와 같은 학번·이름·PIN이에요.</p>
    <div class="grow">
      <label class="f" for="gId">학번<input id="gId" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="예: 30403"></label>
      <label class="f" for="gName">이름<input id="gName" autocomplete="off" placeholder="예: 홍길동"></label>
    </div>
    <div class="grow" id="gStepPin" hidden>
      <label class="f" for="gPin">PIN (숫자 4자리)<input id="gPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>
    </div>
    <div class="grow" id="gStepSetup" hidden>
      <label class="f" for="gCode">휴대폰 번호 뒤 4자리<input id="gCode" inputmode="numeric" maxlength="4" autocomplete="off"></label>
      <label class="f" for="gNew">새로 정할 PIN (숫자 4자리)<input id="gNew" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>
    </div>
    <div class="gmsg" id="gMsg" role="status"></div>
    <div class="gbtns">
      <button class="btn" id="gGo">다음</button>
      <button class="ghost" id="gBack" hidden>학번 다시 입력</button>
      <button class="ghost" id="gGuest">로그인 없이 하기 (이 노트북에만 저장)</button>
    </div>
  </section>

  <div id="view" hidden></div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sosH">
  <div class="in">
    <button class="ghost x" id="sosX">닫기</button>
    <h2 id="sosH">막혔을 때</h2>
    <div class="fixes" id="sosList"></div>
  </div>
</div>

<script>
/* ───── 내용 ─────
 * 모두 같은 주제: 1회차는 과일 받기 게임, 2회차는 그 게임을 소개하는 웹페이지.
 * 블록 종류: text, field(입력칸), chips(고르기), prompt(복사할 요청문 + 보냈어요 체크), todo(할 일), fixes(자주 생기는 고장), tip, gamelink */
var MOODS=["레트로 픽셀","파스텔","네온","흑백 미니멀","동화책"];
var SWATCH=[["진한 남색","#1B2A4A"],["크림","#FFF4DE"],["토마토","#E8483C"],["귤","#F28C28"],["레몬","#F6D04D"],["잎","#5DAA4A"],["포도","#7B4BB8"],["하늘","#4FA3E0"],["먹색","#222222"],["흰색","#FFFFFF"]];
/* 무료 ChatGPT는 몇 번 보내면 막혀서, 회차마다 '보내는 말'은 2번(한 번에 만들기 + 한 번에 고치기)만 쓰고 나머지는 직접 고친다 */
var FIX={
 game:[
  ["fast","과일이 너무 빨라요","과일이 너무 빨리 떨어져. 처음에는 더 천천히 떨어지게 해 줘."],
  ["slow","과일이 너무 느려요","과일이 너무 느리게 떨어져. 조금 더 빠르게 해 줘."],
  ["edge","바구니가 화면 밖으로 나가요","바구니가 화면 밖으로 나가. 화면 양쪽 끝에서 멈추게 해 줘."],
  ["pass","과일이 바구니를 그냥 지나가요","과일이 바구니에 닿아도 그냥 지나가. 닿으면 받은 걸로 처리하고 과일이 사라지게 해 줘."],
  ["touch","터치로 안 움직여요","터치 화면에서 바구니가 안 움직여. 화면 왼쪽 반·오른쪽 반을 누르고 있으면 그쪽으로 움직이게 해 줘."],
  ["restart","다시 시작이 안 돼요","다시 시작 버튼을 눌러도 점수와 목숨이 처음으로 안 돌아가. 처음 상태로 돌아가게 해 줘."],
  ["harder","점점 어렵게 하고 싶어요","점수가 10점 오를 때마다 과일이 조금씩 더 빨리 떨어지게 해 줘."]],
 web:[
  ["mobile","폰 크기에서 글자가 잘리거나 밀려요","폰 크기에서 글자가 잘리거나 화면이 가로로 밀려. 폰에서도 화면 폭에 맞게 고쳐 줘."],
  ["title","제목이 눈에 안 띄어요","첫 화면 제목이 눈에 잘 안 띄어. 더 크고 굵게, 배경과 대비가 강하게 해 줘."],
  ["tight","섹션이 다닥다닥 붙어 있어요","섹션 사이가 너무 붙어 있어. 여백을 넉넉하게 해 줘."],
  ["button","플레이 버튼이 안 열려요","플레이 버튼을 눌러도 안 열려. 새 탭으로 열리게 고쳐 줘."],
  ["howto","게임 방법이 한눈에 안 들어와요","게임 방법이 글로만 되어 있어서 한눈에 안 들어와. 짧은 단계와 아이콘으로 정리해 줘."]]
};
var DATA={
 game:{name:"게임 만들기",no:"1회차",desc:"위에서 떨어지는 과일을 바구니로 받는 게임. 과일 3개를 놓치면 끝나요.",steps:[
  {t:"준비하고 정하기",m:[0,5],msg:0,goal:"게임 이름과 디자인을 먼저 정하기",b:[
   {k:"text",v:"오늘은 모두 같은 게임을 만들어요. 위에서 과일이 떨어지고, 아래 바구니를 왼쪽·오른쪽으로 움직여 받는 게임이에요. 과일을 3개 놓치면 끝나요."},
   {k:"text",v:"무료 ChatGPT는 몇 번 보내면 막혀요. 그래서 오늘은 딱 2번만 보내요. 처음에 한 번에 만들고, 고칠 점을 모아서 한 번에 고쳐요. 나머지는 내가 직접 고쳐요."},
   {k:"field",f:"name",label:"내 게임 이름",ph:"예: 과일 바구니"},
   {k:"chips",f:"mood",label:"분위기",opts:MOODS},
   {k:"field",f:"colors",label:"색 (배경색, 강조색 2~3개)",ph:"예: 남색 배경, 노랑·주황 강조"},
   {k:"todo",items:[

var KEY="vibeGuide2";
function blank(){return {v:3,t:"game",name:"",line:"",maker:"",comment:"",mood:"",colors:"",glink:"",wlink:"",feG:"",feW:"",fx:{game:{},web:{}},c:{game:{},web:{}},at:{game:0,web:0}}}
var S=blank(),view="home";
function norm(d){var b=blank();if(!d||d.v!==3)return b;for(var k in b)if(d[k]!=null)b[k]=d[k];["c","fx"].forEach(function(k){b[k].game=b[k].game||{};b[k].web=b[k].web||{}});return b}

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function isLink(v){return /^https?:\/\/\S+\.\S+/i.test(String(v||"").trim())}
var PH={name:"게임 이름",line:"한 줄 소개",mood:"분위기",colors:"색",maker:"만든 사람",comment:"한마디",glink:"게임 링크"};
function feKey(t){return t==="game"?"feG":"feW"}
function fixCount(t){var x=S.fx[t];if(x.none)return 1;return Object.keys(x).filter(function(k){return x[k]}).length+(S[feKey(t)].trim()?1:0)}
function fixTpl(t){var x=S.fx[t],lines=FIX[t].filter(function(f){return x[f[0]]}).map(function(f){return "- "+f[2]});if(S[feKey(t)].trim())lines.push("- "+S[feKey(t)].trim().replace(/[{}]/g,""));
  return lines.length?"해 보니까 아래 문제가 있어. 한 번에 다 고쳐 주고, 다른 부분은 건드리지 마.\n"+lines.join("\n"):""}
function fill(txt,mark){return txt.replace(/\{(\w+)\}/g,function(_,k){var v=String(S[k]||"").trim();var out=v||("["+PH[k]+"]");return mark?'<mark>'+esc(out)+'</mark>':out})}
function checks(t,i){var out=[];DATA[t].steps[i].b.forEach(function(b){
  if(b.k==="prompt")out.push({id:b.id,opt:!!b.opt});
  if(b.k==="fixprompt")out.push({id:b.id,auto:function(){return !!(S.fx[t].none||S.c[t][b.id])}});
  if(b.k==="todo")b.items.forEach(function(x){out.push({id:x.id,auto:x.auto})})});return out}
function isOn(t,c){return c.auto?!!c.auto():!!S.c[t][c.id]}
function stepState(t,i){var cs=checks(t,i).filter(function(c){return !c.opt});var n=cs.filter(function(c){return isOn(t,c)}).length;return {n:n,all:cs.length,done:n===cs.length}}
function trackDone(t){var k=0;DATA[t].steps.forEach(function(_,i){if(stepState(t,i).done)k++});return k}

function stepHTML(){
  var t=S.t,d=DATA[t],i=S.at[t],st=d.steps[i],ss=stepState(t,i),last=i===d.steps.length-1;
  var segs=d.steps.map(function(x,j){var s=stepState(t,j);var can=j<=i||s.done||(j>0&&stepState(t,j-1).done);
    return '<button class="seg'+(s.done?" done":"")+(j===i?" cur":"")+(can?" can":"")+'" style="flex:'+(x.m[1]-x.m[0])+'" '+(can?'data-step="'+j+'"':'tabindex="-1" aria-disabled="true"')+' aria-label="'+(j+1)+'단계 '+x.t+'"><span>'+(j+1)+'</span></button>'}).join("");
  return '<div class="bar"><div class="brow"><button class="ghost" data-home>← 처음</button>'+
   '<span class="where">'+d.no+' '+d.name+' · <b>'+(i+1)+' / '+d.steps.length+'</b></span>'+
   '<button class="sosbtn" data-sos>막혔어요</button></div>'+
   '<div class="segs">'+segs+'</div><div class="ticks"><span>0분</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60분</span></div></div>'+
  '<article class="card"><div class="shead"><div class="num">'+(i+1)+'</div><div><h2>'+st.t+'</h2><div class="goal">'+st.goal+'</div><span class="badge'+(st.msg?' on':'')+'">'+(st.msg?'ChatGPT에게 보내기 1번':'보내지 않는 단계')+'</span></div><div class="time">'+st.m[0]+'–'+st.m[1]+'분</div></div>'+
   st.b.map(block).join("")+'</article>'+
  '<div class="nav"><div class="left" id="left"'+(ss.done?' hidden':'')+'>'+leftText(ss)+'</div>'+(i>0?'<button class="btn line" data-prev>이전</button>':'')+
   '<button class="btn" id="next" data-next'+(ss.done?'':' disabled')+'>'+(last?"완료":"다음 단계")+'</button></div>'+whoHTML();
}
function leftText(ss){return ss.done?"":"체크 "+(ss.all-ss.n)+"개를 마치면 다음으로 넘어갈 수 있어요."}
function promptBox(id,label,v,opt,note){var t=S.t;
  return '<div class="prompt'+(opt?" opt":"")+'"><div class="ptop"><span class="pl">'+esc(label)+(note?'<small>'+esc(note)+'</small>':'')+(opt?'<small>선택</small>':'')+'</span><button class="copy" data-copy="'+esc(v)+'">복사</button></div>'+
   '<pre data-tpl="'+esc(v)+'">'+fill(esc(v),true)+'</pre>'+
   (id?'<label class="pchk"><input type="checkbox" id="c-'+t+'-'+id+'" data-c="'+id+'"'+(S.c[t][id]?" checked":"")+'><span>보냈고 결과를 확인했어요</span></label>':'')+'</div>'}
function fixBox(id,label){var t=S.t;
  if(S.fx[t].none)return '<div class="prev"><span>고칠 게 없다고 골랐어요. 이 단계는 보내지 않고 넘어가요.</span></div>';
  var v=fixTpl(t);if(!v)return '<div class="prev"><span>앞 단계에서 고칠 점을 먼저 골라 주세요.</span><button class="ghost" data-prev>앞 단계로</button></div>';
  return promptBox(id,label,v)}
function block(b){var t=S.t;
  if(b.k==="text")return '<p class="txt">'+esc(b.v)+'</p>';
  if(b.k==="tip")return '<div class="tip">'+b.v+'</div>';
  if(b.k==="field")return '<label class="f" for="f-'+t+'-'+b.f+'">'+esc(b.label)+'<input id="f-'+t+'-'+b.f+'" data-f="'+b.f+'" value="'+esc(S[b.f])+'" placeholder="'+esc(b.ph)+'" autocomplete="off"></label>';
  if(b.k==="chips")return '<div><div class="lbl">'+esc(b.label)+'</div><div class="chips">'+b.opts.map(function(o){return '<button class="chip" data-chip="'+b.f+'" data-v="'+esc(o)+'" aria-pressed="'+(S[b.f]===o)+'">'+esc(o)+'</button>'}).join("")+'</div></div>';
  if(b.k==="prompt")return promptBox(b.id,b.label,b.v,b.opt,b.note);
  if(b.k==="todo")return '<ul class="todo">'+b.items.map(function(x){var on=isOn(t,{id:x.id,auto:x.auto});
    return '<li><label><input type="checkbox" id="c-'+t+'-'+x.id+'" data-c="'+x.id+'"'+(on?" checked":"")+(x.auto?' disabled data-auto="1"':'')+'><span>'+esc(x.t)+(x.auto?'<em class="auto">칸을 채우면 자동 체크</em>':'')+'</span></label></li>'}).join("")+'</ul>';
  if(b.k==="fixes")return '<div class="fixes">'+b.items.map(function(x){return '<details><summary>'+esc(x[0])+'</summary>'+promptBox(null,"ChatGPT에게 보낼 말",x[1])+'</details>'}).join("")+'</div>';
  if(b.k==="fixpick"){var x=S.fx[t];return '<div><div class="lbl">해당하는 걸 모두 고르세요</div><div class="chips">'+FIX[t].map(function(f){return '<button class="chip" data-fix="'+f[0]+'" aria-pressed="'+!!x[f[0]]+'">'+esc(f[1])+'</button>'}).join("")+
    '<button class="chip" data-fix="none" aria-pressed="'+!!x.none+'">고칠 게 없어요</button></div></div>'}
  if(b.k==="fixprompt")return '<div id="fixp" data-id="'+b.id+'" data-label="'+esc(b.label)+'">'+fixBox(b.id,b.label)+'</div>';
  if(b.k==="swatch")return '<div><div class="lbl">색 코드 (누르면 복사)</div><div class="sw">'+SWATCH.map(function(c){return '<button class="swc" data-hex="'+c[1]+'"><i style="background:'+c[1]+'"></i><span>'+c[0]+'<b>'+c[1]+'</b></span></button>'}).join("")+'</div></div>';
  if(b.k==="gamelink")return isLink(S.glink)?'<div class="prev"><span>지난 시간에 저장한 내 게임</span><a href="'+esc(S.glink.trim())+'" target="_blank" rel="noopener">열기 →</a></div>':
    '<div class="prev"><span>지난 시간 게임 링크가 저장돼 있지 않아요. ChatGPT 왼쪽 목록에서 지난 대화를 찾아 여세요.</span></div>';
  return "";
}
function doneHTML(){var t=S.t,d=DATA[t],link=t==="game"?S.glink:S.wlink;
  return '<div class="panel done"><div class="eyebrow">'+d.no+' 완료</div><h2>'+(t==="game"?esc(S.name||"과일 받기")+" 완성":"게임 소개 페이지 완성")+'</h2>'+
  '<p class="txt">'+(t==="game"?"수고했어요. 다음 시간에는 이 게임을 소개하는 웹페이지를 만들어요. ChatGPT 대화를 지우지 마세요.":"수고했어요. 게임과 소개 페이지 링크는 선생님 쪽에도 저장됐어요.")+'</p>'+
  (isLink(link)?'<div class="prev"><span>내 결과물</span><a href="'+esc(link.trim())+'" target="_blank" rel="noopener">열기 →</a></div>':'')+
  '<div class="gbtns"><button class="btn" data-home>처음 화면으로</button><button class="ghost" data-back>마지막 단계 다시 보기</button></div></div>'+whoHTML();
}
function refreshChecks(){ // 칸 입력 뒤: 요청문·자동 체크·다음 버튼만 갱신 (입력 중인 칸은 그대로)
  document.querySelectorAll("pre[data-tpl]").forEach(function(p){p.innerHTML=fill(esc(p.getAttribute("data-tpl")),true)});
  var t=S.t,i=S.at[t];DATA[t].steps[i].b.forEach(function(b){if(b.k==="todo")b.items.forEach(function(x){if(x.auto){var c=$("c-"+t+"-"+x.id);if(c)c.checked=!!x.auto()}})});
  var fp=$("fixp");if(fp)fp.innerHTML=fixBox(fp.dataset.id,fp.dataset.label);
  var ss=stepState(t,i),n=$("next");if(n)n.disabled=!ss.done;var l=$("left");if(l){l.textContent=leftText(ss);l.hidden=ss.done}
  document.querySelectorAll(".seg").forEach(function(sg,j){sg.classList.toggle("done",stepState(t,j).done)});
}
function copyText(btn,txt){function ok(){btn.textContent="복사됨";btn.classList.add("did");setTimeout(function(){btn.textContent="복사";btn.classList.remove("did")},1500)}
  function fb(){var pre=btn.closest(".prompt").querySelector("pre");var r=document.createRange();r.selectNodeContents(pre);var sel=getSelection();sel.removeAllRanges();sel.addRange(r);btn.textContent="선택됨 · Ctrl+C"}
  try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}}

document.addEventListener("click",function(e){
  var x=e.target.closest("[data-hex],[data-fix],[data-track],[data-step],[data-next],[data-prev],[data-home],[data-back],[data-sos],[data-copy],[data-chip],#reset,#sosX,#sheet");if(!x)return;
  if(x.id==="sheet"){if(e.target===x)x.hidden=true;return}
  if(x.id==="sosX"){$("sheet").hidden=true;return}
  if(x.dataset.copy!=null){copyText(x,fill(x.dataset.copy,false));return}
  if(x.dataset.sos!=null){$("sheet").hidden=false;$("sosX").focus();return}
  if(x.dataset.hex){var h=x.dataset.hex,sp=x.querySelector("b");try{navigator.clipboard.writeText(h).then(function(){sp.textContent="복사됨";setTimeout(function(){sp.textContent=h},1200)},function(){sp.textContent=h})}catch(er){}return}
  if(x.dataset.fix){var f=S.fx[S.t],k=x.dataset.fix;if(k==="none"){var on=!f.none;S.fx[S.t]=on?{none:true}:{}}else{f.none=false;f[k]=!f[k]}save();
    document.querySelectorAll("[data-fix]").forEach(function(c){c.setAttribute("aria-pressed",!!S.fx[S.t][c.dataset.fix])});refreshChecks();return}
  if(x.dataset.chip){S[x.dataset.chip]=x.dataset.v;save();document.querySelectorAll('[data-chip="'+x.dataset.chip+'"]').forEach(function(c){c.setAttribute("aria-pressed",c.dataset.v===S[x.dataset.chip])});refreshChecks();return}
  if(x.dataset.track){S.t=x.dataset.track;var k=trackDone(S.t);if(k===DATA[S.t].steps.length)S.at[S.t]=0;save();go("step",1);return}
  if(x.dataset.step!=null){var j=+x.dataset.step,old=S.at[S.t];S.at[S.t]=j;save();go("step",j<old?-1:1);return}
  if(x.dataset.next!=null){var t=S.t;if(!stepState(t,S.at[t]).done)return;if(S.at[t]<DATA[t].steps.length-1){S.at[t]++;save();go("step",1)}else{save();go("done",1)}return}
  if(x.dataset.prev!=null){S.at[S.t]=Math.max(0,S.at[S.t]-1);save();go("step",-1);return}
  if(x.dataset.back!=null){go("step",-1);return}
  if(x.dataset.home!=null){go("home",-1);return}
  if(x.id==="reset"){if(!x.classList.contains("arm")){x.classList.add("arm");x.textContent="한 번 더 누르면 체크가 모두 지워져요";setTimeout(function(){x.classList.remove("arm");x.textContent="처음부터 다시"},3000)}
    else{var keep=S.t;S=blank();S.t=keep;save();go("home",-1)}}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("sheet").hidden=true});
document.addEventListener("input",function(e){var f=e.target.dataset.f;if(!f)return;S[f]=e.target.value;save();refreshChecks()});
document.addEventListener("change",function(e){var c=e.target.dataset.c;if(!c||e.target.dataset.auto)return;S.c[S.t][c]=e.target.checked;save();refreshChecks()});
$("sosList").innerHTML=SOS.map(function(s){return '<details><summary>'+esc(s[0])+'</summary><p class="sostx">'+esc(s[2])+'</p>'+(s[3]?promptBox(null,"보낼 말",s[3]):'')+'</details>'}).join("");

/* 처음 화면의 작은 게임 예시 */
var demoRaf=0;
function startDemo(){cancelAnimationFrame(demoRaf);var cv=$("demo");if(!cv)return;var x=cv.getContext("2d"),W=cv.width,H=cv.height;
  var cs=getComputedStyle(document.body),acc=cs.getPropertyValue("--game").trim(),ink=cs.getPropertyValue("--ink").trim(),line=cs.getPropertyValue("--line").trim();
  var cols=["#E8483C","#F2B233","#6BBF59","#8E5AC8"],fr=[],bx=W/2,t0=0,score=0;
  function add(){fr.push({x:30+Math.random()*(W-60),y:-14,v:1.4+Math.random()*1.1,c:cols[(Math.random()*4)|0]})}
  function draw(){x.clearRect(0,0,W,H);x.fillStyle=line;x.fillRect(0,H-22,W,2);
    fr.forEach(function(f){x.fillStyle=f.c;x.beginPath();x.arc(f.x,f.y,11,0,7);x.fill();x.fillStyle="#4E8A3A";x.fillRect(f.x-1,f.y-16,2,6)});
    x.fillStyle=acc;x.beginPath();x.moveTo(bx-34,H-52);x.lineTo(bx+34,H-52);x.lineTo(bx+26,H-26);x.lineTo(bx-26,H-26);x.closePath();x.fill();
    x.fillStyle=ink;x.font="600 20px JetBrains Mono, monospace";x.fillText("점수 "+score,14,30)}
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){fr=[{x:W*.3,y:70,c:cols[0]},{x:W*.62,y:150,c:cols[2]}];draw();return}
  function tick(ts){if(!$("demo"))return;if(ts-t0>900){t0=ts;add()}
    var tgt=fr.length?fr.reduce(function(a,b){return b.y>a.y?b:a}).x:W/2;bx+=(tgt-bx)*0.06;
    fr.forEach(function(f){f.y+=f.v});fr=fr.filter(function(f){if(f.y>H-58&&f.y<H-40&&Math.abs(f.x-bx)<36){score++;return false}return f.y<H+20});
    draw();demoRaf=requestAnimationFrame(tick)}
  demoRaf=requestAnimationFrame(tick)}

/* ───── 수업 페이지 로그인 연동: 진행 상황을 학생별로 구글 시트에 저장 ───── */
(function(){
 var API='https://script.google.com/macros/s/AKfycbyw6oiaICnnbyw2l0xVsVCJ0VBI1lz4mQM3N9BpNOs7p0edgAV9dcWNKQxMNTMhIdVykw/exec';
 var TK='vibe_token',GK='vibe_guest',tok=null,me=null,mode='',timer=null,saving=false,again=false,state='';
 function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
 function p(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
 function call(fn){var args=[].slice.call(arguments,1);
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args})})
   .then(function(r){return r.json()}).then(function(r){if(r.err!==undefined)throw new Error(r.err);return r.v})}
 function msg(t){$("gMsg").textContent=t||""}
 function busy(on){$("gGo").disabled=on;$("gGo").textContent=on?"확인 중…":(mode?"로그인":"다음")}
 function showGate(){$("gate").hidden=false;$("view").hidden=true;$("view").style.display="none"}
 function showApp(){$("gate").hidden=true;var h=(location.hash||"").slice(1);if(h==="game"||h==="web"){S.t=h;view="step"}else view="home";render(1)}
 window.vibeChip=function(){var w=$("who");if(!w)return;var f=$("footNote");
  if(!me){w.innerHTML='<span>로그인 안 함 · 이 노트북에만 저장</span><button class="ghost" id="wLogin">로그인</button>';if(f)f.textContent="로그인하지 않아서 이 노트북에만 저장돼요.";return}
  w.innerHTML='<b>'+esc(me.id)+' '+esc(me.name)+'</b><span class="sv'+(/실패|끊김/.test(state)?" bad":"")+'">'+esc(state)+'</span><button class="ghost" id="wOut">로그아웃</button>';
  if(f)f.textContent="진행 상황은 내 계정에 저장돼서 다른 노트북에서도 이어져요."};
 function setState(s){state=s;vibeChip()}
 function summary(){var tr={game:"게임",web:"웹"},parts=[];
  ["game","web"].forEach(function(t){var k=trackDone(t);if(k||Object.keys(S.c[t]).length||t===S.t)parts.push(tr[t]+" "+k+"/"+DATA[t].steps.length+"단계")});
  return {track:tr[S.t],progress:parts.join(" · "),glink:S.glink,wlink:S.wlink}}
 function push(){if(!tok)return;if(saving){again=true;return}saving=true;setState("저장 중…");
  call("apiVibeSave",tok,S,summary()).then(function(r){saving=false;
    if(r&&r.ok)setState("저장됨 "+r.time);else if(r&&r.expired)expire();else{setState("저장 실패 · 다시 시도 중");setTimeout(push,4000)}
    if(again){again=false;push()}})
  .catch(function(){saving=false;setState("연결 끊김 · 다시 시도 중");setTimeout(push,5000)})}
 window.vibeSync=function(){if(!tok)return;clearTimeout(timer);state="저장 대기…";timer=setTimeout(push,1200)};
 function enter(token,who,data){tok=token;me=who;p(TK,token);p(GK,null);
  if(data&&data.v===3){S=norm(data);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}state="불러옴"}
  else{S=blank();state="새로 시작";push()}
  showApp()}
 function expire(){tok=null;p(TK,null);var keep=me;me=null;reset1();if(keep){$("gId").value=keep.id;$("gName").value=keep.name}
  showGate();msg("로그인 시간이 지났어요. 다시 로그인하면 이어서 저장돼요.")}
 function reset1(){mode="";$("gStepPin").hidden=true;$("gStepSetup").hidden=true;$("gBack").hidden=true;$("gId").disabled=false;$("gName").disabled=false;busy(false)}
 function step1(){var id=$("gId").value.replace(/\D/g,""),name=$("gName").value.replace(/\s+/g,"");
  if(id.length!==5||!name){msg("학번 5자리와 이름을 입력해 주세요.");return}
  busy(true);msg("");call("apiCheckStudent",id,name).then(function(r){
   if(!r.ok){busy(false);msg(r.error);return}
   mode=r.mode;me={id:id,name:r.name||name};$("gId").disabled=true;$("gName").disabled=true;$("gBack").hidden=false;busy(false);
   if(mode==="login"){$("gStepPin").hidden=false;$("gPin").value="";$("gPin").focus()}else{$("gStepSetup").hidden=false;$("gCode").focus();msg("처음이라 PIN을 만들어야 해요. 수업 페이지에서도 이 PIN을 써요.")}
  }).catch(function(){busy(false);msg("연결이 안 돼요. 인터넷을 확인하고 다시 눌러 주세요.")})}
 function step2(){var who=me,pr;
  if(mode==="login"){var pin=$("gPin").value.trim();if(!/^\d{4}$/.test(pin)){msg("PIN 숫자 4자리를 입력해 주세요.");return}pr=call("apiLogin",who.id,who.name,pin)}
  else{var code=$("gCode").value.replace(/\D/g,""),np=$("gNew").value.trim();if(code.length!==4||!/^\d{4}$/.test(np)){msg("휴대폰 번호 뒤 4자리와 새 PIN 4자리를 입력해 주세요.");return}pr=call("apiSetupPin",who.id,who.name,code,np)}
  busy(true);msg("");
  pr.then(function(r){if(!r.ok){busy(false);msg(r.error);return}var t=r.token;
    return call("apiVibeLoad",t).then(function(v){busy(false);if(!v.ok){msg(v.error);return}me=null;enter(t,{id:v.id,name:v.name},v.data)})})
  .catch(function(){busy(false);msg("연결이 안 돼요. 인터넷을 확인하고 다시 눌러 주세요.")})}
 $("gGo").addEventListener("click",function(){mode?step2():step1()});
 ["gId","gName","gPin","gCode","gNew"].forEach(function(id){$(id).addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();$("gGo").click()}})});
 $("gBack").addEventListener("click",function(){me=null;reset1();msg("");$("gId").focus()});
 $("gGuest").addEventListener("click",function(){p(GK,"1");tok=null;me=null;showApp()});
 document.addEventListener("click",function(e){
  if(e.target.id==="wOut"){if(tok)call("apiLogout",tok).catch(function(){});tok=null;me=null;p(TK,null);
   S=blank();try{localStorage.removeItem(KEY)}catch(x){}reset1();$("gId").value="";$("gName").value="";msg("로그아웃했어요.");showGate()}
  if(e.target.id==="wLogin"){p(GK,null);reset1();msg("");showGate()}});
 try{var w=JSON.parse(g("cls_who")||"null");if(w&&w.id){$("gId").value=w.id;$("gName").value=w.name||""}}catch(e){}
 var t0=g(TK);
 if(t0){showGate();msg("불러오는 중…");call("apiVibeLoad",t0).then(function(v){msg("");if(v&&v.ok)enter(t0,{id:v.id,name:v.name},v.data);else p(TK,null)}).catch(function(){msg("연결이 안 돼요. 새로고침해 주세요.")})}
 else if(g(GK))showApp();
 else showGate();
})();
</script>
