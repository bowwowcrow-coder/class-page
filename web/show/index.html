<style>
  /* 발표용 한 화면: 왼쪽에 QR·체험 계정이 늘 떠 있고, 오른쪽에서 실제 수업 페이지를 시연한다 */
  :root { --bg: #f5f5f7; --surface: #fff; --ink: #1d1d1f; --sub: #6e6e73; --line: rgba(0,0,0,.08); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; letter-spacing: -0.02em; overflow: hidden; }
  .wrap { display: grid; grid-template-columns: clamp(260px, 26vw, 420px) 1fr; height: 100vh; }
  .side { display: flex; flex-direction: column; gap: 1.6vh; padding: 2.4vh 1.6vw; border-right: 1px solid var(--line); overflow: hidden; }
  .eyebrow { font-size: clamp(12px, 1.6vh, 16px); font-weight: 600; color: var(--sub); }
  h1 { margin: .2vh 0 0; font-size: clamp(20px, 3.6vh, 36px); line-height: 1.15; letter-spacing: -0.04em; }
  .qrcard { background: var(--surface); border-radius: 18px; padding: 1.6vh; text-align: center; cursor: zoom-in; }
  .qr { width: 100%; aspect-ratio: 1; max-height: 34vh; margin: 0 auto; }
  .qr svg { width: 100%; height: 100%; }
  .url { margin-top: .8vh; font-size: clamp(12px, 1.7vh, 17px); font-weight: 700; }
  .box { background: var(--surface); border-radius: 16px; padding: 1.4vh 1.2vw; }
  .box h2 { margin: 0 0 .9vh; font-size: clamp(14px, 2vh, 20px); }
  .box h2 small { margin-left: 6px; font-size: clamp(11px, 1.4vh, 14px); font-weight: 500; color: var(--sub); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: .5vh 1vw; align-items: baseline; margin: 0; font-size: clamp(13px, 1.8vh, 18px); }
  .kv dt { color: var(--sub); }
  .kv dd { margin: 0; font-size: clamp(18px, 3vh, 30px); font-weight: 800; letter-spacing: .02em; }
  .note { margin: 0; font-size: clamp(11px, 1.35vh, 13px); color: var(--sub); line-height: 1.45; }
  .stage { position: relative; background: #fff; }
  .stage iframe { width: 100%; height: 100%; border: 0; display: block; }
  .tools { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(0,0,0,.55); opacity: .45; transition: opacity .2s; }
  .tools:hover { opacity: 1; }
  .tools button { min-width: 30px; height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: none; color: #fff; font: inherit; font-size: 13px; cursor: pointer; }
  .tools button:hover { background: rgba(255,255,255,.18); }
  .big { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(245,245,247,.97); cursor: zoom-out; }
  .big .inner { width: min(80vh, 80vw); text-align: center; }
  .big .url { font-size: 3.4vh; margin-top: 2vh; }
  [hidden] { display: none !important; }
  @media (max-aspect-ratio: 1/1) { .wrap { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .side { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; } .qrcard { width: 140px; } body { overflow: auto; } }
</style>
</head>

  var big = document.getElementById('big');
