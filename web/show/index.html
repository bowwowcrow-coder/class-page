  * { box-sizing: border-box; }
  html { font-size: min(1vw, 1.55vh); } html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; letter-spacing: -0.02em; }
  .stage { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 4rem; align-items: center; padding: 4rem 5rem; }

  .box { background: var(--surface); border-radius: 2rem; padding: 2rem 2.4rem; margin-bottom: 1.6rem; }
  .box h2 { margin: 0 0 1.2rem; font-size: 2.2rem; }
  .box h2 small { margin-left: .8rem; font-size: 1.4rem; font-weight: 500; color: var(--sub); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: .7rem 2rem; align-items: baseline; font-size: 2rem; }
  .kv dt { color: var(--sub); font-weight: 500; }
  .kv dd { margin: 0; font-size: 3rem; font-weight: 800; letter-spacing: .02em; }
  .note { margin: 0; font-size: 1.35rem; color: var(--sub); line-height: 1.5; }
  @media (max-aspect-ratio: 1/1) {
    html { font-size: 16px; }
    .stage { grid-template-columns: 1fr; padding: 24px 16px; gap: 20px; }
    .qrcard { padding: 20px; border-radius: 22px; max-width: 360px; margin: 0 auto; width: 100%; }
    .url { font-size: 16px; } .eyebrow { font-size: 14px; } h1 { font-size: 30px; margin-bottom: 16px; }
    .box { padding: 18px 20px; border-radius: 18px; margin-bottom: 12px; } .box h2 { font-size: 19px; margin-bottom: 10px; } .box h2 small { font-size: 13px; }
    .kv { font-size: 16px; gap: 6px 16px; } .kv dd { font-size: 24px; } .note { font-size: 13px; }
  }
