<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --ink: #1d1d1f;
    --sub: #6e6e73;
    --line: rgba(0, 0, 0, .08);
    --fill: rgba(118, 118, 128, .12);
    --seg: #ffffff;
    --bar: rgba(245, 245, 247, .82);
    --accent: #0071e3;
    --accent-down: #0062c4;
    --danger: #d70015;
    --green: #248a3d;
    --orange: #b25000;
    /* 지연도 신호등 */
    --lv0: #34c759; --lv1: #ffcc00; --lv2: #ff9500; --lv3: #ff3b30; --lvx: #af52de; --lvn: #c7c7cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --ink: #f5f5f7;
      --sub: #98989d;
      --line: rgba(255, 255, 255, .12);
      --fill: rgba(118, 118, 128, .24);
      --seg: #636366;
      --bar: rgba(0, 0, 0, .72);
      --accent: #0a84ff;
      --accent-down: #409cff;
      --danger: #ff453a;
      --green: #30d158;
      --orange: #ff9f0a;
      --lv0: #30d158; --lv1: #ffd60a; --lv2: #ff9f0a; --lv3: #ff453a; --lvx: #bf5af2; --lvn: #48484a;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }

  /* 불러오는 중 */
  .boot { min-height: 100%; display: grid; place-items: center; }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid var(--fill); border-top-color: var(--sub);
    animation: spin .8s linear infinite;
  }
  .loading { display: grid; place-items: center; padding: 40px 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 로그인 */
  .auth { min-height: 100%; display: grid; place-items: center; padding: 32px 20px; }
  .auth-box { width: 100%; max-width: 360px; }
  /* 메인 짤: 디자인 툴의 선택 상자처럼 점선 테두리 + 모서리 조절점 + 이름표 */
  .auth.has-meme { align-content: center; gap: 28px; }
  .meme-frame { position: relative; width: 100%; max-width: 360px; margin: 14px auto 0; padding: 10px; border: 1px dashed var(--accent); }
  .meme-frame img { display: block; width: 100%; max-height: 30vh; object-fit: contain; background: var(--fill); }
  .meme-label { position: absolute; left: -1px; top: -21px; padding: 2px 7px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; letter-spacing: .02em; }
  .meme-frame .h { position: absolute; width: 8px; height: 8px; background: var(--surface); border: 1px solid var(--accent); }
  .meme-frame .tl { left: -5px; top: -5px; } .meme-frame .tr { right: -5px; top: -5px; } .meme-frame .bl { left: -5px; bottom: -5px; } .meme-frame .br { right: -5px; bottom: -5px; }
  .meme-frame figcaption { margin-top: 8px; font-size: 15px; line-height: 1.45; }
  .meme-frame figcaption small { display: block; margin-top: 2px; font-size: 12px; color: var(--sub); }
  @media (min-width: 900px) {
    .auth.has-meme { grid-template-columns: minmax(0, 440px) 360px; justify-content: center; align-items: center; gap: 72px; }
    .auth.has-meme .meme-frame { max-width: 440px; margin: 0; }
    .meme-frame img { max-height: 62vh; }
  }
  /* 메인 짤: 학생 홈의 후보 투표, 올리기 */
  .meme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .meme-card { position: relative; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: var(--surface); text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .meme-card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--fill); }
  .meme-card .cap { display: block; padding: 8px 10px 10px; font-size: 13px; line-height: 1.4; min-height: 1.4em; }
  .meme-card .vote { position: absolute; right: 8px; top: 8px; padding: 3px 9px; border-radius: 12px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 600; }
  .meme-card[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--accent); }
  .meme-card[aria-pressed="true"] .vote { background: var(--accent); }
  .meme-now { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: var(--surface); }
  .meme-now img { flex: none; width: 88px; height: 88px; object-fit: cover; border-radius: 10px; background: var(--fill); }
  .meme-now b { display: block; font-size: 12px; color: var(--accent-ink, var(--accent)); }
  .meme-now span { display: block; margin-top: 2px; font-size: 15px; }
  .meme-now small { display: block; margin-top: 2px; font-size: 12px; color: var(--sub); }
  .meme-pick { display: grid; place-items: center; gap: 6px; width: 100%; min-height: 180px; margin-top: 16px; border: 1.5px dashed var(--line); border-radius: 14px; background: var(--fill); color: var(--sub); font: inherit; font-size: 15px; cursor: pointer; overflow: hidden; }
  .meme-pick img { display: block; max-width: 100%; max-height: 46vh; }
  .meme-pick strong { color: var(--ink); font-size: 16px; }
  @media (pointer: coarse) { .meme-pick .pc-only { display: none; } }
  .mine-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .mine-row span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; border-radius: 10px; background: var(--surface); font-size: 12px; color: var(--sub); }
  .mine-row img { width: 28px; height: 28px; object-fit: cover; border-radius: 6px; }
  /* 메인 짤: 교사 관리 */
  .mm-item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; }
  .mm-item img { flex: none; width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--fill); cursor: zoom-in; }
  .mm-item .t { flex: 1; min-width: 0; }
  .mm-item .t b { display: block; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .mm-item .t small { display: block; font-size: 12px; color: var(--sub); }
  .mm-item .acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 46%; }
  .mm-item .acts .mini { margin-top: 0; height: 30px; padding: 0 10px; font-size: 13px; }
  .mm-item .acts .mini.blue { background: var(--accent); color: #fff; }
  .votes { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent-ink, var(--accent)); }
  .mode-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; border-radius: 9px; background: var(--fill); }
  .mode-seg button { height: 34px; border: 0; border-radius: 7px; background: none; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; }
  .mode-seg button[aria-pressed="true"] { background: var(--surface); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .slot-pick { display: flex; gap: 8px; margin-top: 10px; }
  .slot-pick select { flex: 1; height: 38px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--fill); font: inherit; color: var(--ink); }
  .auth-sub { margin: 0 0 4px; color: var(--sub); font-size: 15px; }
  .auth-title { margin: 0 0 32px; font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
  .lead { margin: 0 0 20px; color: var(--sub); font-size: 15px; }
  .lead strong { color: var(--ink); font-weight: 600; }

  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; margin: 0 0 6px 2px; font-size: 13px; color: var(--sub); }
  .field input {
    width: 100%; height: 50px; padding: 0 16px;
    border: 0; border-radius: 12px;
    background: var(--surface); font-size: 17px;
    box-shadow: inset 0 0 0 1px var(--line);
    transition: box-shadow .15s;
  }
  .field input::placeholder { color: color-mix(in srgb, var(--sub) 60%, transparent); }
  .field input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
  .field input.pin { letter-spacing: .5em; font-size: 20px; }
  .field input.code { letter-spacing: .08em; }

  .btn {
    display: block; width: 100%; height: 50px; margin-top: 20px;
    border: 0; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 17px; font-weight: 600;
    transition: background .15s, opacity .15s;
  }
  .btn:hover:not(:disabled) { background: var(--accent-down); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.quiet, .btn.quiet:hover:not(:disabled) { background: var(--fill); color: var(--ink); }
  .link {
    display: block; margin: 14px auto 0; padding: 6px 10px;
    border: 0; background: none; cursor: pointer;
    color: var(--accent-ink, var(--accent)); font-size: 15px;
  }
  .link.danger { color: var(--danger); }
  .link.faint { margin-top: 28px; color: var(--sub); font-size: 13px; }
  .msg { min-height: 21px; margin: 12px 2px 0; color: var(--danger); font-size: 14px; }
  .note { margin: 20px 2px 0; color: var(--sub); font-size: 13px; }
  .demo-note { white-space: pre-line; padding: 12px 14px; border-radius: 12px; background: var(--fill); line-height: 1.7; }
  .demo-note:empty { display: none; }

  /* 본 화면 뼈대 : 모바일은 상단 바 + 칩, 넓은 화면은 왼쪽 사이드바 */
  .side {
    position: sticky; top: 0; z-index: 10;
    display: grid; grid-template-columns: 1fr auto; align-items: baseline;
    padding: 14px 0 12px;
    background: var(--bar);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .brand { margin: 0; padding-left: 20px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .who { display: flex; align-items: baseline; gap: 10px; padding-right: 20px; font-size: 14px; color: var(--sub); white-space: nowrap; }
  .who-meta { display: none; }
  .who button { border: 0; background: none; padding: 4px 0; cursor: pointer; color: var(--accent-ink, var(--accent)); font-size: 14px; }

  .nav, .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .nav { grid-column: 1 / -1; margin-top: 12px; padding: 0 20px; }
  .chips { margin-bottom: 20px; }
  .nav-label { display: none; }
  .nav button, .chips button {
    flex: none; height: 34px; padding: 0 14px;
    border: 0; border-radius: 17px; cursor: pointer;
    background: var(--fill); font-size: 14px; font-weight: 500;
    transition: background .18s, color .18s;
  }
  .nav button[aria-current="true"], .chips button[aria-current="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

  .page { width: 100%; max-width: 680px; margin: 0 auto; padding: 28px 20px 72px; }
  .page.wide { max-width: 920px; }
  .page-sub { margin: 0 0 2px; min-height: 21px; font-size: 14px; color: var(--sub); }
  .page-title { margin: 0 0 20px; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; }

  @media (min-width: 900px) {
    .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
    .side {
      display: flex; flex-direction: column; align-items: stretch;
      height: 100vh; padding: 32px 16px 24px;
      background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none;
      border-bottom: 0; border-right: 1px solid var(--line);
    }
    .brand { padding: 0 12px; }
    .nav { flex-direction: column; gap: 2px; margin-top: 24px; padding: 0; overflow: visible; }
    .nav-label { display: block; margin: 18px 12px 6px; font-size: 12px; color: var(--sub); }
    .nav button { height: 38px; padding: 0 12px; border-radius: 10px; background: transparent; text-align: left; font-size: 15px; }
    .nav button:hover { background: var(--fill); }
    .nav button[aria-current="true"] { background: var(--fill); color: var(--ink); }
    .who { order: 3; margin-top: auto; padding: 16px 12px 0; flex-wrap: wrap; gap: 2px 10px; border-top: 1px solid var(--line); }
    .who-name { color: var(--ink); font-weight: 600; }
    .who-meta { display: inline; }
    .who button { margin-left: auto; }
    .page { padding-top: 48px; }
  }

  /* 구획 */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-bottom: 20px; padding: 2px; border-radius: 10px; background: var(--fill); }
  .seg button {
    height: 34px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
    font-size: 14px; font-weight: 500;
    transition: background .18s, box-shadow .18s;
  }
  .seg button[aria-selected="true"] { background: var(--seg); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

  .group-title { display: flex; justify-content: space-between; gap: 12px; margin: 28px 4px 8px; font-size: 13px; font-weight: 500; color: var(--sub); }
  .group-title:first-child { margin-top: 0; }

  .list { background: var(--surface); border-radius: 16px; overflow: hidden; }
  .list > :not(:first-child) { border-top: 1px solid var(--line); }

  /* 공지 (수업 탭) */
  .notice { padding: 18px 20px; }
  .notice-head { display: block; }
  .notice time { display: block; margin-top: 2px; }
  .notice h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
  .notice time, .row-side { flex: none; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .notice p, .row-body { margin: 6px 0 0; font-size: 15px; color: var(--sub); white-space: pre-wrap; }
  .pin-tag { display: inline-block; margin-right: 6px; color: var(--accent-ink, var(--accent)); font-size: 13px; font-weight: 600; }

  /* 목록 행 */
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 20px;
    border: 0; background: none; text-align: left; text-decoration: none; color: inherit; cursor: pointer;
  }
  div.row { cursor: default; }
  a.row:hover, button.row:hover { background: var(--fill); }
  .row-text { flex: 1; min-width: 0; }
  .row-title { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
  .row-desc { font-size: 14px; color: var(--sub); }
  .row-side { text-align: right; }
  .row-side strong { display: block; font-size: 13px; font-weight: 600; }
  .row svg { flex: none; width: 8px; height: 14px; color: color-mix(in srgb, var(--sub) 55%, transparent); }
  .list > .open-body { margin: 0; padding: 0 20px 16px; border-top: 0; }

  /* 레퍼런스 썸네일 : 이미지가 있든 없든 같은 크기의 칸 */
  .thumb {
    flex: none; width: 44px; height: 44px; border-radius: 10px; overflow: hidden;
    display: grid; place-items: center;
    background: var(--fill); color: var(--sub); font-size: 17px; font-weight: 600;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.icon img { width: 24px; height: 24px; object-fit: contain; }

  /* 과제 카드 */
  .task { background: var(--surface); border-radius: 16px; padding: 22px 20px 20px; }
  .task + .task { margin-top: 16px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .open { color: var(--green); }
  .late { color: var(--orange); }
  .closed { color: var(--sub); }
  .task h3 { margin: 8px 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .task > .desc { margin: 0; font-size: 15px; color: var(--sub); white-space: pre-line; text-wrap: balance; }
  .kv { margin: 18px 0 0; border-top: 1px solid var(--line); }
  .kv div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .kv dt { flex: none; color: var(--sub); }
  .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kv dd small { display: block; font-size: 13px; color: var(--sub); }

  /* 신호등 점 */
  .dot { flex: none; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--lvn); }
  .lv-0 { background: var(--lv0); } .lv-1 { background: var(--lv1); } .lv-2 { background: var(--lv2); }
  .lv-3 { background: var(--lv3); } .lv-x { background: var(--lvx); } .lv-n { background: var(--lvn); }
  .dot.allowed { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--lvx); }
  .state { display: flex; align-items: center; gap: 8px; margin-top: 20px; font-size: 15px; font-weight: 600; }

  /* 제출 폼 */
  .form { margin-top: 8px; }
  .form.busy { pointer-events: none; opacity: .6; }
  .slot { padding: 14px 0; border-top: 1px solid var(--line); }
  .slot:first-child { border-top: 0; }
  .slot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .slot-head strong { font-size: 15px; font-weight: 600; }
  .slot-head span { font-size: 13px; color: var(--sub); }
  .mini { height: 34px; margin-top: 10px; padding: 0 14px; border: 0; border-radius: 17px; background: var(--fill); font-size: 14px; font-weight: 500; cursor: pointer; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .pick { position: relative; width: 76px; height: 76px; padding: 0; border: 0; border-radius: 12px; overflow: hidden; background: var(--fill); cursor: pointer; }
  .pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pick.rep { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .pick b { position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 0; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; text-align: center; }
  .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; font-size: 14px; line-height: 22px; cursor: pointer; }
  .file-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--fill); font-size: 14px; }
  .file-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row .x { position: static; flex: none; }
  .hint { margin: 8px 0 0; font-size: 13px; color: var(--sub); }

  /* 교사 현황판 */
  .summary { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .summary strong { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .summary span { color: var(--sub); font-size: 15px; }
  .summary button { border: 0; background: none; padding: 4px 0; color: var(--accent-ink, var(--accent)); font-size: 14px; cursor: pointer; }
  .legend { display: grid; grid-template-columns: repeat(3, max-content); gap: 6px 18px; margin-bottom: 8px; font-size: 13px; color: var(--sub); }
  @media (min-width: 600px) { .legend { grid-template-columns: repeat(6, max-content); } }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 10px; height: 10px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .tile {
    display: grid; justify-items: start; gap: 6px; padding: 12px;
    border: 0; border-radius: 14px; background: var(--surface); text-align: left; cursor: pointer;
    transition: transform .12s;
  }
  .tile:hover { transform: translateY(-1px); }
  .tile.away { opacity: .55; }
  .tile-note { font-size: 12px; color: var(--sub); }
  .tile-num { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .tile { min-width: 0; }
  .tile > * { min-width: 0; max-width: 100%; }
  .tile-name { font-size: 15px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; } /* 긴 영문 이름이 옆 칸으로 넘치지 않게 */

  /* 점수, 선생님 메모 */
  .note-box, .result { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--fill); }
  .note-box strong { display: block; font-size: 13px; font-weight: 500; color: var(--sub); }
  .note-box p { margin: 4px 0 0; font-size: 15px; white-space: pre-wrap; }
  .result-score { display: flex; align-items: baseline; gap: 10px; }
  .result-score strong { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  .result-score span { font-size: 15px; color: var(--sub); }
  .result .btn { height: 44px; margin-top: 12px; font-size: 15px; }

  /* 체크 과제 */

  .switch[aria-checked="true"] { background: var(--lv0); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
  .switch:disabled { opacity: .5; }
  .back { margin: 0 0 12px; padding: 6px 0; }

  /* 아래에서 올라오는 창 */
  .sheet { position: fixed; inset: 0; z-index: 50; display: grid; place-items: end center; background: rgba(0, 0, 0, .36); }
  .sheet-box { width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 24px 20px 28px; border-radius: 20px 20px 0 0; background: var(--surface); }
  .sheet-box h3 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .sheet-box > p { margin: 6px 0 0; font-size: 15px; color: var(--sub); }
  .sheet-box .list { margin-top: 16px; background: var(--fill); }
  .sheet-box .row { padding: 12px 14px; }
  .preview { display: block; width: 100%; max-height: 360px; margin-top: 16px; border-radius: 12px; object-fit: contain; background: var(--fill); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (min-width: 600px) {
    .sheet { place-items: center; padding: 24px; }
    .sheet-box { border-radius: 20px; }
  }

  /* 짧은 문장은 줄 길이를 고르게 나눠 한두 글자만 떨어지는 줄바꿈을 막는다 */
  .lead, .hint, .note, .msg, .desc, .empty, .row-title, .row-desc, .notice h3, .notice p, .task h3, .note-box p, .sheet-box > p, .page-title { text-wrap: balance; }
  .hint, .empty, .msg { white-space: pre-line; }
  .row-side { white-space: nowrap; }
  .row-meta { margin-top: 2px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .row-meta strong { margin-right: 8px; font-weight: 600; }
  .kv dt, .kv dd { white-space: nowrap; }
  .kv dd.wrap { white-space: normal; }

  .empty { margin: 0; padding: 48px 20px; text-align: center; color: var(--sub); font-size: 15px; }
  .list .empty { padding: 28px 20px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .spinner { animation-duration: 2s; }
  }
</style>

      <p class="lead"><strong id="setupWho"></strong> 님, 처음 접속입니다.<br>본인 확인을 하고 PIN을 정해 주세요.</p>
      <label class="field"><span><?= codeLabel ?></span>

<div id="sheet" class="sheet" hidden><div class="sheet-box" id="sheetBox" role="dialog" aria-modal="true"></div></div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var TOKEN_KEY = 'cls_token', TTOKEN_KEY = 'cls_ttoken', WHO_KEY = 'cls_who';
  var MB = 1024 * 1024;
  var REFS = document.body.getAttribute('data-refs') || '자료'; // 세 번째 탭 이름 (설정에서 정한다)
  /* 받침에 맞는 조사: josa('자료', '이', '가') → '자료가' */
  function josa(word, withBatchim, without) {
    var code = word.charCodeAt(word.length - 1);
    var has = code >= 0xAC00 && code <= 0xD7A3 ? (code - 0xAC00) % 28 !== 0 : false;
    return word + (has ? withBatchim : without);
  }
  var TAB_NAMES = {
    course: { notices: '공지', refs: REFS, tasks: '과제', surveys: '설문' },
    'class': { notices: '공지', refs: '자료', tasks: '제출', surveys: '설문', trip: '체험학습' },
    club: { notices: '공지', refs: '자료', tasks: '과제', surveys: '설문' }
  };
  var LEVEL_TEXT = { n: '미제출', '0': '정시', '1': '지각 1~3일', '2': '지각 4~7일', '3': '지각 8일 이상', x: '마감 후 허용' };

  var token = null;       // 학생 로그인
  var me = { id: '', name: '' };
  var data = null;        // 학생 화면 데이터
  var current = 'home';   // 'home' 또는 수업ID
  var tabOf = {};         // 수업별로 보고 있던 탭
  var drafts = {};        // 과제별로 고르는 중인 파일
  var sdrafts = {};       // 설문별로 고르는 중인 답
  var galleryOf = {};     // 수업별로 열어 둔 모아보기(과제ID)

  var ttoken = null;      // 교사 로그인
  var board = null, tCourse = null, tTask = null, roster = null, tView = 'board', posts = null;
  var tSurveys = null, tSurvey = null; // 교사: 설문 목록, 결과를 보고 있는 설문

  /* 저장소는 막혀 있을 수 있어 항상 감싼다 */
  function keep(store, key, value) { try { value == null ? store.removeItem(key) : store.setItem(key, value); } catch (e) {} }
  function recall(store, key) { try { return store.getItem(key); } catch (e) { return null; } }

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[fn].apply(runner, args);
    });
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function button(cls, text, onClick) {
    var b = el('button', cls, text);
    b.type = 'button';
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }

  function chevron() {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 8 14');
    svg.setAttribute('aria-hidden', 'true');
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('d', 'M1 1l6 6-6 6');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);
    return svg;
  }

  /* 지연도 → 신호등 단계 */
  function level(state, lateDays) {
    if (state === 'none') return 'n';
    if (state === 'ontime') return '0';
    if (state === 'exception') return 'x';
    return lateDays <= 3 ? '1' : (lateDays <= 7 ? '2' : '3');
  }
  function stateText(state, lateDays) {
    if (state === 'ontime') return '정시 제출';
    if (state === 'exception') return '마감 후 제출, ' + lateDays + '일 지연';
    if (state === 'late') return '지각 제출, ' + lateDays + '일 지연';
    return '미제출';
  }

  /* ── 화면 전환 ── */
  function view(name) {
    ['boot', 'auth', 'app', 'tapp'].forEach(function (id) { $(id).hidden = id !== name; });
  }
  function step(name) {
    ['f-id', 'f-setup', 'f-login', 'f-teacher'].forEach(function (id) { $(id).hidden = id !== name; });
    say('');
    var first = $(name).querySelector('input');
    if (first) first.focus();
  }
  function say(text) { $('msg').textContent = text || ''; }

  function busy(form, on) {
    var btn = form.querySelector('.btn');
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = '확인 중'; }
    else if (btn.dataset.label) { btn.textContent = btn.dataset.label; }
    btn.disabled = on;
  }

  function submit(form, work) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (form.querySelector('.btn').disabled) return;
      say('');
      var job = work();
      if (!job) return;
      busy(form, true);
      job.then(function (res) {
        busy(form, false);
        if (res && !res.ok) say(res.error || '다시 시도해 주세요.');
      }).catch(function (err) {
        busy(form, false);
        say(friendly(err));
      });
    });
  }

  /* ── 아래에서 올라오는 창 ── */
  var sheetDirty = false;   // 창 안에서 무언가 적거나 고쳤는지
  var downOnBack = false;   // 누르기 시작한 곳이 창 바깥(어두운 부분)인지
  function openSheet(node) {
    var box = $('sheetBox');
    box.textContent = '';
    box.appendChild(node);
    sheetDirty = false;
    $('sheet').hidden = false;
  }
  function closeSheet() { $('sheet').hidden = true; $('sheetBox').textContent = ''; sheetDirty = false; }
  $('sheetBox').addEventListener('input', function () { sheetDirty = true; });
  $('sheetBox').addEventListener('change', function () { sheetDirty = true; });
  // 창 바깥은 '거기서 누르고 거기서 뗄 때'만 닫는다. 창 안에서 끌다가 바깥에서 손을 떼도 닫히지 않게.
  // 무언가 적은 뒤에는 바깥을 눌러도 닫지 않는다(취소 버튼으로만 닫는다).
  $('sheet').addEventListener('pointerdown', function (e) { downOnBack = e.target === $('sheet'); });
  $('sheet').addEventListener('click', function (e) {
    var ok = downOnBack && e.target === $('sheet') && !sheetDirty;
    downOnBack = false;
    if (ok) closeSheet();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

  function confirmSheet(title, text, okLabel) {
    return new Promise(function (resolve) {
      var wrap = el('div');
      wrap.appendChild(el('h3', '', title));
      wrap.appendChild(el('p', '', text));
      var pair = el('div', 'pair');
      pair.appendChild(button('btn quiet', '취소', function () { closeSheet(); resolve(false); }));
      pair.appendChild(button('btn', okLabel, function () { closeSheet(); resolve(true); }));
      wrap.appendChild(pair);
      openSheet(wrap);
    });
  }

  /* ── 로그인 흐름 ── */
  submit($('f-id'), function () {
    var id = $('sid').value.trim();
    var name = $('sname').value.replace(/\s+/g, '');
    var idLen = Number($('sid').maxLength) || 5; // 학번 자릿수는 설정(학번 구조)에서 온다
    if (!new RegExp('^\\d{' + idLen + '}$').test(id) || !name) { say('학번 ' + idLen + '자리와 이름을 입력해 주세요.'); return null; }
    return call('apiCheckStudent', id, name).then(function (res) {
      if (!res.ok) return res;
      me = { id: id, name: name };
      keep(localStorage, WHO_KEY, JSON.stringify(me));
      $('setupWho').textContent = res.name;
      $('loginWho').textContent = res.name;
      step(res.mode === 'setup' ? 'f-setup' : 'f-login');
      return res;
    });
  });

  submit($('f-setup'), function () {
    var code = $('code').value.replace(/\D/g, '');
    var p1 = $('pin1').value, p2 = $('pin2').value;
    if (code.length < 4) { say($('code').dataset.label + ' 칸을 확인해 주세요.'); return null; }
    if (!/^\d{4}$/.test(p1)) { say('PIN은 숫자 4자리로 정해 주세요.'); return null; }
    if (p1 !== p2) { say('두 PIN이 서로 다릅니다.'); return null; }
    return call('apiSetupPin', me.id, me.name, code, p1).then(enter);
  });

  submit($('f-login'), function () {
    var pin = $('pin').value;
    if (!/^\d{4}$/.test(pin)) { say('PIN 4자리를 입력해 주세요.'); return null; }
    return call('apiLogin', me.id, me.name, pin).then(function (res) {
      if (!res.ok) $('pin').value = '';
      return enter(res);
    });
  });

  submit($('f-teacher'), function () {
    var pw = $('tpw').value;
    if (!pw) { say('비밀번호를 입력해 주세요.'); return null; }
    return call('apiTeacherLogin', pw).then(function (res) {
      $('tpw').value = '';
      if (!res.ok) return res;
      ttoken = res.token;
      keep(sessionStorage, TTOKEN_KEY, ttoken);
      startTeacher(res.board);
      return res;
    });
  });

  $('toTeacher').addEventListener('click', function () { step('f-teacher'); });
  document.querySelectorAll('[data-back]').forEach(function (btn) {
    btn.addEventListener('click', function () { clearSecrets(); step('f-id'); });
  });

  function clearSecrets() {
    ['code', 'pin1', 'pin2', 'pin', 'tpw'].forEach(function (id) { $(id).value = ''; });
  }

  function enter(res) {
    if (!res.ok) return res;
    token = res.token; trip.data = null; trip.view = 'list';
    keep(sessionStorage, TOKEN_KEY, token);
    clearSecrets();
    start(res.home);
    return res;
  }

  function signOut(message) {
    var old = token || ttoken;
    token = null; ttoken = null; trip.data = null; trip.view = 'list'; trip.edit = null;
    keep(sessionStorage, TOKEN_KEY, null);
    keep(sessionStorage, TTOKEN_KEY, null);
    if (old) call('apiLogout', old).catch(function () {});
    closeSheet();
    showAuth();
    if (message) say(message);
  }
  $('logout').addEventListener('click', function () { signOut(); });
  $('tlogout').addEventListener('click', function () { signOut(); });

  function showAuth() {
    var saved = recall(localStorage, WHO_KEY);
    if (saved) {
      try { var w = JSON.parse(saved); $('sid').value = w.id || ''; $('sname').value = w.name || ''; } catch (e) {}
    }
    view('auth');
    step('f-id');
  }

  /* 서버 응답 검사: 실패면 예외로 바꾸고, 로그인이 풀렸으면 첫 화면으로 */
  function must(res) {
    if (res && res.ok) return res;
    if (res && res.expired) { signOut(res.error); throw new Error('expired'); }
    var err = new Error((res && res.error) || '다시 시도해 주세요.');
    err.known = true; // 서버가 알려 준 안내 문구
    throw err;
  }
  /* 서버 안내 문구는 그대로, 그 밖의 오류는 원인을 괄호 안에 함께 보여 준다 */
  function friendly(err) {
    if (err && err.known) return err.message;
    var detail = err && err.message ? String(err.message).replace(/^(Exception|Error|ScriptError):\s*/, '') : '';
    return '문제가 생겼습니다. 잠시 후 다시 시도해 주세요.' + (detail ? '\n(' + detail + ')' : '');
  }

  /* ═════════════ 학생 화면 ═════════════ */
  function start(home) {
    data = home;
    current = 'home';
    tabOf = {};
    drafts = {};
    sdrafts = {};
    galleryOf = {};
    var s = home.student;
    $('whoName').textContent = s.name;
    $('whoMeta').textContent = s.grade + '학년 ' + s.cls + '반 ' + s.num + '번';
    buildNav($('nav'), data.courses, true, go);
    draw();
    view('app');
  }

  function courseById(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function courseName(id) { var c = courseById(data.courses, id); return c ? c.name : '전체'; }

  function buildNav(nav, courses, withHome, onGo) {
    nav.textContent = '';
    function add(id, label) {
      var b = button('', label, function () { onGo(id); });
      b.dataset.view = id;
      nav.appendChild(b);
    }
    if (withHome) add('home', '홈');
    var lessons = courses.filter(function (c) { return c.kind === 'course'; });
    var rooms = courses.filter(function (c) { return c.kind === 'class'; });
    if (lessons.length) nav.appendChild(el('span', 'nav-label', '수업'));
    lessons.forEach(function (c) { add(c.id, c.name); });
    if (rooms.length) nav.appendChild(el('span', 'nav-label', '학급'));
    rooms.forEach(function (c) { add(c.id, c.name); });
    var clubs = courses.filter(function (c) { return c.kind === 'club'; });
    if (clubs.length) nav.appendChild(el('span', 'nav-label', '동아리'));

  /* ── 수업 / 학급 ── */
  function drawCourse(box, course) {
    if (!course) { current = 'home'; return draw(); }
    $('viewSub').textContent = course.desc;
    $('viewTitle').textContent = course.name;
    var names = TAB_NAMES[course.kind] || TAB_NAMES.course;
    var tab = tabOf[course.id] || 'notices';
    // 넣어 둔 자료가 없는 수업은 그 탭을 아예 보이지 않게 한다
    var hasRefs = fromCourse(data.refs, course.id).length > 0;
    var hasSurveys = fromCourse(data.surveys || [], course.id).length > 0; // 설문도 올라온 것이 있을 때만 탭이 생긴다
    if (!hasRefs && tab === 'refs') tab = 'notices';
    if (!hasSurveys && tab === 'surveys') tab = 'notices';
    var hasTrip = course.kind === 'class'; // 교외체험학습은 담임 반에서만
    if (!hasTrip && tab === 'trip') tab = 'notices';
    $('seg').hidden = false;
    $('seg').style.gridTemplateColumns = 'repeat(' + (2 + hasRefs + hasSurveys + hasTrip) + ', 1fr)';
    $('seg').querySelectorAll('button').forEach(function (b) {
      b.textContent = names[b.dataset.tab] || '';
      b.hidden = (b.dataset.tab === 'refs' && !hasRefs) || (b.dataset.tab === 'surveys' && !hasSurveys) || (b.dataset.tab === 'trip' && !hasTrip);
      b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false');
    });
    if (tab === 'notices') drawNotices(box, fromCourse(data.notices, course.id));
    else if (tab === 'refs') drawRefs(box, fromCourse(data.refs, course.id), names.refs);
    else if (tab === 'surveys') drawSurveys(box, fromCourse(data.surveys || [], course.id));
    else if (tab === 'trip') drawTrips(box);
    else {
      var shown = courseById(data.tasks, galleryOf[course.id]);
      if (shown && shown.gallery) drawGallery(box, shown);
      else drawTasks(box, fromCourse(data.tasks, course.id), names.tasks);
    }
  }

  /* 레퍼런스 썸네일: 지정 이미지 → 사이트 아이콘 → 제목 첫 글자 */
  function refThumb(r, linked) {
    var box = el('span', 'thumb');
    var letter = (r.title || '?').trim().charAt(0).toUpperCase();
    var src = '';
    if (/^(https?:\/\/|data:image\/)/i.test(r.image)) src = r.image;
    else if (linked) {
      try { src = 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(new URL(r.url).hostname); box.className = 'thumb icon'; } catch (e) {}
    }
    if (!src) { box.textContent = letter; return box; }
    var img = el('img');
    img.alt = '';
    img.loading = 'lazy';
    img.referrerPolicy = 'no-referrer';
    img.addEventListener('error', function () { box.className = 'thumb'; box.textContent = letter; });
    img.src = src;
    box.appendChild(img);
    return box;
  }

  function drawRefs(box, items, label) {
    if (!items.length) { box.appendChild(el('p', 'empty', '아직 등록된 ' + josa(label, '이', '가') + ' 없습니다.')); return; }
    var order = [], groups = {};
    items.forEach(function (r) {
      if (!groups[r.group]) { groups[r.group] = []; order.push(r.group); }
      groups[r.group].push(r);
    });
    order.forEach(function (name) {
      box.appendChild(el('h3', 'group-title', name));
      var list = el('div', 'list');
      groups[name].forEach(function (r) {
        var linked = /^https?:\/\//i.test(r.url);
        var row = el(linked ? 'a' : 'div', 'row');
        if (linked) { row.href = r.url; row.target = '_blank'; row.rel = 'noopener'; }
        row.appendChild(refThumb(r, linked));
        var text = el('div', 'row-text');
        text.appendChild(el('div', 'row-title', r.title));
        if (r.desc) text.appendChild(el('div', 'row-desc', r.desc));
        row.appendChild(text);
        if (linked) row.appendChild(chevron());
        list.appendChild(row);
      });
      box.appendChild(list);
    });
  }

  /* 그림을 상한 안에 들도록 줄인다: 긴 변과 화질을 차례로 낮춰 본다 */
  function fitJpeg(img, sides, limit) {
    for (var i = 0; i < sides.length; i++) for (var q = 0.82; q >= 0.5; q -= 0.08) {
      var b = shrink(img, sides[i], q);
      if (b.length <= limit) return b;

    return '';
  }
  function openMemeUpload(teacher) { // teacher: { pickLabel } — 선생님 화면에서 열 때

    if (s.done && !d.editing) {
      if (s.anon) { card.appendChild(noteBox('응답했습니다', '익명 설문이라 낸 응답은 고칠 수 없습니다.')); return card; }

        card.appendChild(block);
      });
      if (s.open) card.appendChild(button('btn quiet', '응답 고치기', function () { d.editing = true; d.ans = JSON.parse(JSON.stringify(s.mine || [])); d.msg = ''; draw(); }));
      return card;
    }
    if (!s.open) { card.appendChild(noteBox('마감', '이 설문은 지금 응답을 받지 않습니다.')); return card; }

    if (!d.ans) d.ans = s.qs.map(function (q) { return q.t === 'many' ? [] : ''; });
    var form = el('div');
    s.qs.forEach(function (q, i) { form.appendChild(questionBlock(s, q, i, d)); });
    card.appendChild(form);
    var msg = el('p', 'msg', d.msg);
    card.appendChild(msg);
    form.addEventListener('input', function () { msg.textContent = ''; });
    form.addEventListener('change', function () { msg.textContent = ''; });
    var send = button('btn', s.anon ? '익명으로 제출' : (s.done ? '고친 내용 제출' : '제출'), function () {
      d.msg = ''; msg.textContent = '';
      for (var i = 0; i < s.qs.length; i++) {
        var q = s.qs[i], v = d.ans[i];
        var list = Array.isArray(v) ? v : (v ? [v] : []);
        if (list.some(function (x) { return x === ETC || (String(x).indexOf(ETC) === 0 && !String(x).slice(ETC.length).trim()); })) { msg.textContent = (i + 1) + '번 문항의 기타 칸에 내용을 적어 주세요.'; return; }
        if (q.req && !(Array.isArray(v) ? v.length : String(v || '').trim())) { msg.textContent = (i + 1) + '번 문항에 답해 주세요.'; return; }
      }
      if (s.anon && !d.armed) { d.armed = true; send.textContent = '한 번 더 누르면 제출합니다 (고칠 수 없어요)'; return; }
      send.disabled = true;
      call('apiSubmitSurvey', token, s.id, d.ans).then(function (res) {
        must(res);
        data = res.home;
        delete sdrafts[s.id];
        draw();
      }).catch(function (err) {
        send.disabled = false; d.armed = false;
        send.textContent = s.anon ? '익명으로 제출' : '제출';
        if (err && err.message !== 'expired') msg.textContent = friendly(err);
      });
    });
    card.appendChild(send);
    if (d.editing) card.appendChild(button('link', '고치지 않고 닫기', function () { d.editing = false; d.ans = null; draw(); }));
    return card;
  }
  function questionBlock(s, q, i, d) {
    var block = el('div', 'sq');
    var title = el('div', 'sq-title', (i + 1) + '. ' + q.q);
    if (q.req) title.appendChild(el('span', 'req', '*'));
    block.appendChild(title);
    if (q.t === 'text') {
      var area = el('textarea', 'memo');
      area.maxLength = 2000;
      area.placeholder = '여기에 적어 주세요.';
      area.value = d.ans[i] || '';
      area.addEventListener('input', function () { d.ans[i] = area.value; });
      block.appendChild(area);
      return block;
    }
    if (q.t === 'many') block.appendChild(el('div', 'sq-hint', '여러 개를 고를 수 있습니다.'));
    var name = 'q_' + s.id + '_' + i, rows = [];
    var picked = function () { return q.t === 'many' ? d.ans[i] : (d.ans[i] ? [d.ans[i]] : []); };
    var paint = function () { rows.forEach(function (r) { r.label.classList.toggle('on', r.input.checked); if (r.etc) r.etc.disabled = !r.input.checked; }); };
    var store = function () {
      var list = rows.filter(function (r) { return r.input.checked; }).map(function (r) { return r.etc ? ETC + r.etc.value.trim() : r.value; });
      d.ans[i] = q.t === 'many' ? list : (list[0] || '');
      paint();
    };
    var opts = q.o.slice();
    if (q.etc) opts.push(null); // 기타
    opts.forEach(function (o) {
      var label = el('label', 'choice');
      var input = el('input');
      input.type = q.t === 'many' ? 'checkbox' : 'radio';
      input.name = name;
      var row = { label: label, input: input, value: o };
      label.appendChild(input);
      if (o === null) {
        var current = picked().filter(function (x) { return String(x).indexOf(ETC) === 0; })[0];
        input.checked = current != null;
        label.appendChild(document.createTextNode('기타'));
        var etc = el('input', 'etc-in');
        etc.type = 'text'; etc.maxLength = 200; etc.placeholder = '직접 적기';
        etc.value = current ? String(current).slice(ETC.length) : '';
        etc.addEventListener('input', store);
        etc.addEventListener('focus', function () { if (!input.checked) { input.checked = true; store(); } });
        label.appendChild(etc);
        row.etc = etc;
      } else {
        input.checked = picked().indexOf(o) >= 0;
        label.appendChild(document.createTextNode(o));
      }
      input.addEventListener('change', function () {
        store();
        if (row.etc && input.checked) row.etc.focus();
      });
      rows.push(row);
      block.appendChild(label);
    });
    paint();
    // 하나만 고르는 문항은 다시 누르면 고른 것을 지울 수 있게
    if (q.t === 'one' && !q.req) block.appendChild(button('link faint', '선택 지우기', function () { rows.forEach(function (r) { r.input.checked = false; }); store(); }));
    return block;
  }

  function kvRow(dl, key, value, small) {

  /* 고르는 중인 파일 한 칸: 새 파일은 { file }, 이미 낸 파일은 { kept: 드라이브ID, name, src } */
  function draftOf(t) { return drafts[t.id] || (drafts[t.id] = { files: {}, texts: {}, rep: 0, editing: false, msg: '', orig: '' }); }
  function entryName(e) { return e.file ? e.file.name : e.name; }
  function entrySrc(e) { return e.file ? fileUrl(e.file) : e.src; }
  function signature(t, d) {
    return t.slots.map(function (_, i) {
      return (d.files[i] || []).map(function (e) { return e.kept || 'new'; }).join(',');
    }).join('|') + '#' + d.rep + '#' + t.slots.map(function (s, i) { return s.kind === 'text' ? (d.texts[i] || '').trim() : ''; }).join('\u0001');
  }
  function utf8Base64(text) { return btoa(unescape(encodeURIComponent(text))); }

  function noteBox(title, text) {
    var box = el('div', 'note-box');
    box.appendChild(el('strong', '', title));
    box.appendChild(el('p', '', text));
    return box;
  }

  function resultBox(t) {

    return box;
  }

  async function confirmScore(t) {
    var r = t.result;
    var sure = await confirmSheet('점수를 확인했나요?', r.grade + ' ' + r.points + '점을 확인했고 이상이 없다는 기록이 시각과 함께 남습니다.', '확인했습니다');
    if (!sure) return;
    try {
      data = must(await call('apiConfirmScore', token, t.id)).home;
    } catch (err) {
      if (err && err.message === 'expired') return;
      draftOf(t).msg = friendly(err);
    }
    draw();
  }

  function taskCard(t) {
    var card = el('article', 'task');

    }

      card.appendChild(ck);
    }

    if (t.alt) card.appendChild(noteBox('대체과제', '이 과제는 대체과제로 제출합니다.\n파일 형식과 개수에 제한이 없습니다.'));

    var d = draftOf(t);

      state.appendChild(document.createTextNode(stateText(t.mine.state, t.mine.lateDays)));

        var n = t.mine.files.filter(function (f) { return f.s === i; }).length;
        if (slot.kind === 'text') return slot.name + (n ? ' 작성' : ' 없음');
        return slot.name + ' ' + n + (slot.kind === 'image' ? '장' : '개');
      }).join(', '));
      card.appendChild(mine);
      t.mine.files.forEach(function (f) { // 내가 적은 글은 바로 보여 준다
        if (f.x) card.appendChild(noteBox((t.slots[f.s] && t.mine.alt === !!t.alt ? t.slots[f.s].name : '글'), f.x));
      });
    }
    if (t.mine && t.locked) {
      var lock = el('p', 'hint', '채점이 끝나 수정할 수 없습니다.\n수정이 필요하면 선생님께 말씀하세요.');
      lock.style.whiteSpace = 'pre-line';

    }

      return card;
    }
    if (!editing) {
      card.appendChild(button('btn quiet', '수정', function () { startEdit(t); }));
      card.appendChild(button('link danger', '제출 삭제', function () { removeSubmission(t); }));
      if (d.msg) card.appendChild(el('p', 'msg', d.msg));

  /* 수정: 이미 낸 파일을 그대로 펼쳐 놓고 하나씩 빼거나 더한다 */
  function startEdit(t) {
    var d = draftOf(t);
    d.editing = true;
    d.msg = '';
    d.files = {};
    d.texts = {};
    d.rep = 0;
    var rs = repSlot(t);
    if (t.mine.alt !== !!t.alt) { // 일반 제출 ↔ 대체과제로 바뀐 경우: 예전 파일은 칸이 달라 이어 쓸 수 없다
      d.orig = '';
      d.msg = '제출 방식이 바뀌어 파일을 새로 올려야 합니다.';
      return draw();
    }
    t.mine.files.forEach(function (f) {
      if (t.slots[f.s] && t.slots[f.s].kind === 'text') { d.texts[f.s] = f.x || ''; return; } // 글은 내용을 그대로 펼쳐 놓는다
      var list = d.files[f.s] || (d.files[f.s] = []);
      if (f.s === rs && f.r) d.rep = list.length;
      list.push({ kept: f.id, name: f.n, src: '' });
    });
    d.orig = signature(t, d);
    draw();
    call('apiMyPreviews', token, t.id).then(function (res) {
      if (!res || !res.ok || drafts[t.id] !== d) return;
      Object.keys(d.files).forEach(function (i) {
        d.files[i].forEach(function (e) { if (e.kept && res.previews[e.kept]) e.src = res.previews[e.kept]; });
      });
      if (current === t.course) draw();
    }).catch(function () {});
  }

  function countText(slot) {
    var unit = slot.kind === 'image' ? '장' : '개';
    var kind = slot.kind === 'image' ? 'jpg, png ' : (slot.kind === 'pdf' ? 'PDF ' : '');
    return kind + (slot.min === slot.max ? slot.max + unit : slot.min + '~' + slot.max + unit);
  }
  function sizeText(bytes) { return bytes >= MB ? (bytes / MB).toFixed(1) + 'MB' : Math.max(1, Math.round(bytes / 1024)) + 'KB'; }
  function fileUrl(file) { return file._url || (file._url = URL.createObjectURL(file)); }
  function repSlot(t) { for (var i = 0; i < t.slots.length; i++) if (t.slots[i].kind === 'image') return i; return -1; }

  function checkFile(file, slot) {
    var name = file.name.toLowerCase();
    if (slot.kind === 'image') {
      if (!/^image\/(jpeg|png)$/.test(file.type) && !/\.(jpe?g|png)$/.test(name)) return 'jpg 또는 png 이미지만 올릴 수 있습니다.';
      if (file.size > 30 * MB) return '이미지가 너무 큽니다. 30MB 이하로 올려 주세요.';
    } else if (slot.kind === 'pdf') {
      if (file.type !== 'application/pdf' && !/\.pdf$/.test(name)) return slot.name + ' 칸에는 PDF 파일만 올릴 수 있습니다.';
      if (file.size > 10 * MB) return 'PDF가 너무 큽니다. 10MB 이하로 줄여 주세요.';
    } else if (file.size > 25 * MB) {
      return '파일이 너무 큽니다. 25MB 이하로 올려 주세요.';
    }
    return '';
  }

  function submitForm(t, d) {
    var form = el('div', 'form');
    var rs = repSlot(t);
    t.slots.forEach(function (slot, i) {
      if (slot.kind === 'text') { // 글로 적어 내는 칸
        var tbox = el('div', 'slot');
        var thead = el('div', 'slot-head');
        thead.appendChild(el('strong', '', slot.name));
        thead.appendChild(el('span', '', slot.min ? '글로 작성' : '글로 작성 (선택)'));
        tbox.appendChild(thead);
        var area = el('textarea', 'memo tall answer');
        area.maxLength = 3000;
        area.placeholder = '여기에 적어 주세요.';
        area.value = d.texts[i] || '';
        area.addEventListener('input', function () {
          d.texts[i] = area.value;
          if (d.msg) { d.msg = ''; var shown = form.querySelector('.msg'); if (shown) shown.textContent = ''; } // 적기 시작하면 안내를 지운다
        });
        tbox.appendChild(area);
        form.appendChild(tbox);
        return;
      }
      var picked = d.files[i] || (d.files[i] = []);
      var box = el('div', 'slot');
      var head = el('div', 'slot-head');
      head.appendChild(el('strong', '', slot.name));
      head.appendChild(el('span', '', countText(slot)));
      box.appendChild(head);

      if (slot.kind === 'image' && picked.length) {
        var picks = el('div', 'picks');
        picked.forEach(function (entry, k) {
          var isRep = i === rs && k === d.rep;
          var pick = button('pick' + (isRep ? ' rep' : ''), null, function () { if (i === rs) { d.rep = k; draw(); } });
          pick.setAttribute('aria-label', entryName(entry) + (isRep ? ', 대표 이미지' : ''));
          if (entrySrc(entry)) { var img = el('img'); img.alt = ''; img.src = entrySrc(entry); pick.appendChild(img); }
          else pick.appendChild(el('span', 'pick-name', entryName(entry)));
          if (isRep) pick.appendChild(el('b', '', '대표'));
          var x = el('span', 'x', '×');
          x.setAttribute('role', 'button');
          x.setAttribute('aria-label', '빼기');
          x.addEventListener('click', function (e) {
            e.stopPropagation();
            picked.splice(k, 1);
            if (i === rs) d.rep = d.rep > k ? d.rep - 1 : Math.min(d.rep, Math.max(picked.length - 1, 0));
            draw();
          });
          pick.appendChild(x);
          picks.appendChild(pick);
        });
        box.appendChild(picks);
        if (i === rs && picked.length > 1) box.appendChild(el('p', 'hint', '모아보기에 보일 대표 이미지를 눌러서 고르세요.'));
      } else {
        picked.forEach(function (entry, k) {
          var row = el('div', 'file-row');
          row.appendChild(el('span', '', entryName(entry)));
          row.appendChild(document.createTextNode(entry.file ? sizeText(entry.file.size) : '제출됨'));
          row.appendChild(button('x', '×', function () { picked.splice(k, 1); draw(); }));
          box.appendChild(row);
        });
      }

      var input = el('input');
      input.type = 'file';
      input.hidden = true;
      input.multiple = slot.max > 1;
      if (slot.kind === 'image') input.accept = 'image/jpeg,image/png';
      if (slot.kind === 'pdf') input.accept = 'application/pdf';
      input.addEventListener('change', function () {
        d.msg = '';
        Array.prototype.forEach.call(input.files, function (file) {
          var problem = checkFile(file, slot);
          if (problem) { d.msg = problem; return; }
          if (slot.max === 1) { picked.length = 0; picked.push({ file: file }); return; }
          if (picked.length >= slot.max) { d.msg = slot.name + '은(는) 최대 ' + slot.max + (slot.kind === 'image' ? '장' : '개') + '까지 올릴 수 있습니다.'; return; }
          picked.push({ file: file });
        });
        draw();
      });
      box.appendChild(input);
      if (picked.length < slot.max || slot.max === 1) {
        box.appendChild(button('mini', picked.length ? (slot.max === 1 ? '바꾸기' : '추가') : '파일 선택', function () { input.click(); }));
      }
      form.appendChild(box);
    });

    form.appendChild(el('p', 'msg', d.msg || ''));
    var send = button('btn', t.mine ? '다시 제출' : '제출', function () { doSubmit(t, d, form, send); });
    send.style.marginTop = '8px';
    form.appendChild(send);
    if (t.mine) form.appendChild(button('link', '취소', function () { delete drafts[t.id]; draw(); }));
    return form;
  }

  function readBase64(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { var e = new Error('파일을 읽지 못했습니다: ' + file.name); e.known = true; reject(e); };
      r.readAsDataURL(file);
    });
  }
  function loadImage(src, name) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { var e = new Error('이미지를 열지 못했습니다: ' + name); e.known = true; reject(e); };
      img.src = src;
    });
  }
  /* 가운데를 정사각형으로 잘라 size 크기의 JPEG로 만든다 (레퍼런스 썸네일용) */
  function squareThumb(img, size, quality) {
    var side = Math.min(img.naturalWidth, img.naturalHeight);
    var canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
    return canvas.toDataURL('image/jpeg', quality).split(',')[1];
  }
  /* 긴 변을 maxSide로 줄여 JPEG로 만든다 (투명 배경은 흰색으로) */
  function shrink(img, maxSide, quality) {
    var scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    var canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', quality).split(',')[1];
  }
  async function prepare(file, slot) {
    if (slot.kind === 'image') {
      var type = /png$/i.test(file.type) || /\.png$/i.test(file.name) ? 'image/png' : 'image/jpeg';
      if (file.size <= 4 * MB) return { mime: type, b64: await readBase64(file) };
      return { mime: 'image/jpeg', b64: shrink(await loadImage(fileUrl(file), file.name), 2600, 0.9) }; // 큰 이미지는 줄여서 올린다
    }
    return { mime: slot.kind === 'pdf' ? 'application/pdf' : (file.type || ''), b64: await readBase64(file) };
  }

  async function doSubmit(t, d, form, send) {
    for (var i = 0; i < t.slots.length; i++) {
      if (t.slots[i].kind === 'text') {
        if (t.slots[i].min && !(d.texts[i] || '').trim()) { d.msg = t.slots[i].name + ' 칸에 내용을 적어 주세요.'; return draw(); }
        continue;
      }
      if ((d.files[i] || []).length < t.slots[i].min) {
        d.msg = t.slots[i].name + ' 칸에 파일을 ' + t.slots[i].min + (t.slots[i].kind === 'image' ? '장' : '개') + ' 이상 올려 주세요.';
        return draw();
      }
    }
    if (t.mine && d.orig && signature(t, d) === d.orig) { d.msg = '바뀐 내용이 없습니다.'; return draw(); }
    if (t.mine && t.mine.state === 'ontime' && t.window !== 'open') {
      var sure = await confirmSheet('지각으로 바뀝니다', '정시에 낸 제출이 있습니다. 지금 다시 제출하면 마지막 제출 시각 기준으로 지각 처리됩니다.', '다시 제출');
      if (!sure) return;
    }
    var jobs = [], keeps = [];
    t.slots.forEach(function (slot, i) {
      if (slot.kind === 'text') { // 글은 고칠 때마다 통째로 다시 보낸다
        if ((d.texts[i] || '').trim()) jobs.push({ slot: i, order: 1, text: d.texts[i].trim(), def: slot });
        return;
      }
      (d.files[i] || []).forEach(function (entry, k) {
        if (entry.kept) keeps.push({ id: entry.kept, order: k + 1 });
        else jobs.push({ slot: i, order: k + 1, file: entry.file, def: slot });
      });
    });
    var rs = repSlot(t);
    var repIndex = rs >= 0 && (d.files[rs] || [])[d.rep] ? d.rep : 0;
    var repEntry = rs >= 0 ? (d.files[rs] || [])[repIndex] : null;
    var total = jobs.length + (repEntry ? 1 : 0), done = 0;

    form.classList.add('busy');
    send.disabled = true;
    send.textContent = '올리는 중 0/' + total;
    try {
      var begin = must(await call('apiBeginSubmit', token, t.id, keeps));
      for (var j = 0; j < jobs.length; j++) {
        var isText = jobs[j].text != null;
        var p = isText ? { mime: 'text/plain', b64: utf8Base64(jobs[j].text) } : await prepare(jobs[j].file, jobs[j].def);
        must(await call('apiUploadFile', token, begin.uploadId, jobs[j].slot, jobs[j].order, isText ? 'text.txt' : jobs[j].file.name, p.mime, p.b64));
        send.textContent = '올리는 중 ' + (++done) + '/' + total;
      }
      if (repEntry) {
        var source;
        if (repEntry.file) source = fileUrl(repEntry.file);
        else { // 이미 낸 이미지를 대표로 쓸 때는 원본을 받아 와서 줄인다
          var got = must(await call('apiMyFile', token, t.id, repEntry.kept));
          source = 'data:' + got.mime + ';base64,' + got.b64;
        }
        var small = shrink(await loadImage(source, entryName(repEntry)), 800, 0.82);
        must(await call('apiUploadFile', token, begin.uploadId, -1, 1, 'thumb.jpg', 'image/jpeg', small));
        send.textContent = '올리는 중 ' + (++done) + '/' + total;
      }
      send.textContent = '마무리하는 중';
      var res = must(await call('apiCommitSubmit', token, begin.uploadId, repIndex + 1));
      delete drafts[t.id];
      data = res.home;
      draw();
    } catch (err) {
      if (err && err.message === 'expired') return;
      d.msg = friendly(err);
      draw();
    }
  }

  async function removeSubmission(t) {
    var sure = await confirmSheet('제출을 삭제할까요?', '삭제하면 미제출 상태가 됩니다. 마감 뒤에 다시 내면 지각으로 처리됩니다.', '삭제');

  function loadGallery(wrap, tok, taskId, onPick) {
    wrap.textContent = '';
    var wait = el('div', 'loading'); wait.appendChild(el('div', 'spinner')); wrap.appendChild(wait);
    call('apiGalleryList', tok, taskId).then(function (res) {
      must(res);
      wrap.textContent = '';
      if (!res.items.length) { wrap.appendChild(el('p', 'empty', '아직 제출된 작품이 없습니다.')); return; }
      var grid = el('div', 'masonry');
      var cells = {};
      res.items.forEach(function (it) {
        var cell = button('shot', null, function () { if (it.src) onPick(it); });
        cell.setAttribute('aria-label', it.name || '작품');
        var holder = el('div', 'shot-wait');
        cell.appendChild(holder);
        if (it.name) cell.appendChild(el('span', 'shot-name', it.name));
        grid.appendChild(cell);
        cells[it.key] = { item: it, holder: holder };
      });
      wrap.appendChild(grid);

      // 이미지는 6장씩, 동시에 3묶음까지 받아서 도착하는 대로 채운다
      var queue = [];
      for (var i = 0; i < res.items.length; i += 6) queue.push(res.items.slice(i, i + 6).map(function (it) { return it.key; }));
      function next() {
        var batch = queue.shift();
        if (!batch || !wrap.isConnected) return;
        call('apiGalleryThumbs', tok, taskId, batch).then(function (r) {
          if (!r || !r.ok) return;
          Object.keys(r.thumbs).forEach(function (key) {
            var c = cells[key];
            if (!c) return;
            var img = el('img');
            img.alt = c.item.name || '';
            img.src = r.thumbs[key];
            c.item.src = r.thumbs[key];
            c.holder.replaceWith(img);
          });
        }).catch(function () {}).then(next);
      }
      next(); next(); next();
    }).catch(function (err) {
      if (err && err.message === 'expired') return;
      wrap.textContent = '';
      wrap.appendChild(el('p', 'empty', friendly(err)));
    });
  }

  /* ── 과제 만들기·고치기 ── */
  var DEFAULT_SCALE = 'A:20, B:17, C:14, D:11, E:7, 미제출:4';
  // 제출 형식: [종류, 표시 이름, 안내, 체크했을 때의 기본 칸]
  var SLOT_KINDS = [
    ['text', '글', '화면에서 바로 적어 냅니다.', { name: '글', kind: 'text', min: 1, max: 1 }],
    ['image', '이미지', 'jpg, png', { name: '이미지', kind: 'image', min: 1, max: 5 }],
    ['pdf', '문서 (PDF)', '', { name: '문서', kind: 'pdf', min: 1, max: 1 }],
    ['file', '파일 (형식 자유)', '파일 하나에 25MB까지', { name: '파일', kind: 'file', min: 1, max: 1 }]
  ];
  function localInput(ms) { // 날짜 선택 칸에 넣는 형식 (기기의 현지 시각)
    if (!ms) return '';
    var d = new Date(ms), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function openTaskForm(t) {

    desc.value = t ? t.desc : '';
    var due = el('input'); due.type = 'datetime-local'; due.value = t ? localInput(t.dueAt) : '';
    var fin = el('input'); fin.type = 'datetime-local'; fin.value = t && t.finAt !== t.dueAt ? localInput(t.finAt) : '';

    // 평가 여부: 켜면 배점 칸이 나타난다

    var scaleText = function (x) { return x.scale.map(function (s) { return s.g + ':' + s.p; }).join(', '); };
    var scale = textBox(t && t.graded ? scaleText(t) : (lastGraded ? scaleText(lastGraded) : DEFAULT_SCALE), 200, DEFAULT_SCALE);
    var scaleField = field('배점 (등급:점수를 쉼표로)', scale);

    // 제출 형식: 받을 형식을 체크하면 그 형식의 칸이 생긴다 (여러 개를 함께 고를 수 있다)

        slots: locked ? slots : slots.slice().sort(function (a, b) { var at = function (s) { for (var i = 0; i < SLOT_KINDS.length; i++) if (SLOT_KINDS[i][0] === s.kind) return i; return 9; }; return at(a) - at(b); })

  /* ── 교외체험학습: 학교 양식 그대로 채워서 보여 주고 인쇄한다 ── */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function kDate(s) { if (!s) return ''; var p = s.split('-').map(Number); return p[0] + '년 ' + p[1] + '월 ' + p[2] + '일'; }
  function md(s) { if (!s) return ''; var p = s.split('-').map(Number); return p[1] + '월 ' + p[2] + '일'; }
  function tripWeekdays(from, to) {
    if (!from || !to || to < from) return 0;
    var n = 0, d = new Date(from + 'T00:00:00'), end = new Date(to + 'T00:00:00');
    while (d <= end && n < 400) { var w = d.getDay(); if (w !== 0 && w !== 6) n++; d.setDate(d.getDate() + 1); }
    return n;

  /* ── 설문: 목록, 결과, 만들기 ── */
  function spin(box) { box.textContent = ''; var w = el('div', 'loading'); w.appendChild(el('div', 'spinner')); box.appendChild(w); }
  function loadSurveys() {
    var box = $('tcontent'), asked = tCourse;

      if (asked !== tCourse || tView !== 'surveys') return;

      row.appendChild(text);
      row.appendChild(chevron());

    });
    box.appendChild(list);
    box.appendChild(el('p', 'hint', '설문을 누르면 결과를 봅니다.'));
  }
  function loadSurveyResult(id) {

      if (tView !== 'surveys' || tSurvey !== id) return;

    }).catch(function (err) {
      if (err && err.message === 'expired') return;
      box.textContent = '';

      box.appendChild(el('p', 'empty', friendly(err)));
    });

  function drawSurveyResult(res) {
    var box = $('tcontent'), sv = res.survey, meta = courseById(tSurveys.surveys, sv.id);
    box.textContent = '';
    box.appendChild(button('back', '‹ 설문 목록', function () { tSurvey = null; drawSurveyList(); }));
    var card = el('article', 'task');
    var head = el('div');

    head.appendChild(el('span', 'status ' + (sv.open ? 'open' : 'closed'), sv.open ? '응답 받는 중' : '마감'));
    card.appendChild(head);
    card.appendChild(el('h3', '', sv.title));
    if (sv.desc) card.appendChild(el('p', 'desc', sv.desc));
    var summary = el('div', 'summary');

    var count = el('div');

    summary.appendChild(count);
    var tools = el('div', 'tools');

    if (meta) tools.appendChild(button('', '다른 수업에 복사', function () { openSurveyCopy(meta); }));
    tools.appendChild(button('', '새로고침', function () { loadSurveyResult(sv.id); }));
    summary.appendChild(tools);
    card.appendChild(summary);
    if (sv.due) card.appendChild(el('p', 'hint', sv.due + '까지'));
    if (res.missing.length) {
      card.appendChild(el('h4', 'sec', '아직 응답하지 않은 학생 ' + res.missing.length + '명'));
      var chips = el('div', 'who-chips');

      var copyNames = button('mini', '이름 복사', function () {

      });
      card.appendChild(copyNames);
    } else if (res.target) card.appendChild(el('p', 'hint', '대상 학생이 모두 응답했습니다.'));
    if (sv.anon) card.appendChild(el('p', 'hint', '익명 설문이라 누가 무엇을 골랐는지는 기록되지 않습니다. 응답 여부만 보입니다.'));
    box.appendChild(card);

    res.questions.forEach(function (q, i) {
      var qc = el('article', 'task');
      qc.appendChild(el('div', 'sq-title', (i + 1) + '. ' + q.q));
      qc.appendChild(el('div', 'sq-hint', (q.t === 'one' ? '하나 고르기' : q.t === 'many' ? '여러 개 고르기' : '주관식') + ', ' + q.answered + '명 답함'));
      if (q.t === 'text') {
        if (!q.texts.length) qc.appendChild(el('p', 'hint', '아직 답이 없습니다.'));
        q.texts.forEach(function (a) { var x = el('div', 'ans'); if (a.who) x.appendChild(el('small', '', a.who)); x.appendChild(document.createTextNode(a.text)); qc.appendChild(x); });
      } else {
        var top = Math.max.apply(null, q.options.map(function (o) { return o.count; }).concat([0]));
        var base = q.t === 'many' ? Math.max(q.answered, 1) : Math.max(q.answered, 1); // 응답한 사람 대비 비율
        q.options.forEach(function (o) {
          var r = el('div', 'bar-row');
          var lb = el('div', '', o.label);
          if (o.count && o.count === top) lb.style.fontWeight = '600';
          r.appendChild(lb);
          r.appendChild(el('div', 'n', o.count + '명 · ' + Math.round(o.count * 100 / base) + '%'));
          var track = el('div', 'bar-track'), fill = el('div', 'bar-fill');

          track.appendChild(fill); r.appendChild(track);
          qc.appendChild(r);

        if (q.etcTexts.length) {
          qc.appendChild(el('h4', 'sec', '기타에 적은 내용'));
          q.etcTexts.forEach(function (a) { var x = el('div', 'ans'); if (a.who) x.appendChild(el('small', '', a.who)); x.appendChild(document.createTextNode(a.text)); qc.appendChild(x); });
        }
      }
      box.appendChild(qc);
    });
    var copy = button('btn quiet', '결과 표 복사 (엑셀에 붙여넣기)', function () {
      copyText(res.table.map(function (r) { return r.map(function (c) { return String(c).replace(/[\t\n]+/g, ' '); }).join('\t'); }).join('\n'))
        .then(function () { copy.textContent = '복사했습니다'; setTimeout(function () { copy.textContent = '결과 표 복사 (엑셀에 붙여넣기)'; }, 1800); });
    });
    copy.disabled = !res.count;
    box.appendChild(copy);
  }

  var Q_TYPES = [['one', '하나 고르기'], ['many', '여러 개 고르기'], ['text', '주관식']];
  var Q_SCALE = ['매우 그렇다', '그렇다', '보통이다', '그렇지 않다', '전혀 그렇지 않다'];
  /* 설문을 다른 수업에도 그대로 만든다 (응답은 따로 받는다) */
  function openSurveyCopy(sv) {
    var wrap = el('div');
    wrap.appendChild(el('h3', '', '다른 수업에 복사'));
    wrap.appendChild(el('p', 'hint', '"' + sv.title + '"을 고른 수업에 똑같이 만듭니다.\n문항·익명·마감이 그대로 들어가고, 응답은 수업마다 따로 모입니다.'));
    var picked = {};
    var list = el('div', 'acs');
    board.courses.filter(function (c) { return c.id !== tCourse; }).forEach(function (c) {
      var b = button('dc', c.name, function () { picked[c.id] = !picked[c.id]; b.setAttribute('aria-pressed', picked[c.id] ? 'true' : 'false'); });
      b.setAttribute('aria-pressed', 'false');

    });
    wrap.appendChild(list);
    var toggles = el('div', 'list toggles');
    toggles.style.marginTop = '16px';

    toggles.appendChild(pub);
    wrap.appendChild(toggles);
    var msg = el('p', 'msg', '');
    wrap.appendChild(msg);
    var pair = el('div', 'pair');
    pair.appendChild(button('btn quiet', '취소', closeSheet));
    var ok = button('btn', '복사', function () {
      var ids = Object.keys(picked).filter(function (k) { return picked[k]; });
      if (!ids.length) { msg.textContent = '복사할 수업을 골라 주세요.'; return; }
      ok.disabled = true; msg.textContent = '복사하는 중';
      var data = { id: '', title: sv.title, desc: sv.desc, anon: sv.anon, qs: sv.qs, open: sv.open !== false, dueAt: sv.dueAt || 0, published: pub.isOn() };
      ids.reduce(function (p, id) { return p.then(function () { return call('apiTeacherSaveSurvey', ttoken, id, data).then(must); }); }, Promise.resolve())
        .then(function () {
          var names = ids.map(function (id) { return courseById(board.courses, id).name; }).join(', ');
          closeSheet();
          alertSheet(names + '에 복사했어요.' + (pub.isOn() ? '' : '\n아직 게시하지 않았으니 그 수업의 설문 탭에서 켜 주세요.'));
        })
        .catch(function (err) { ok.disabled = false; if (err && err.message !== 'expired') msg.textContent = friendly(err); });
    });
    pair.appendChild(ok);
    wrap.appendChild(pair);
    openSheet(wrap);
  }
  function openSurveyForm(sv) {
    var locked = !!(sv && sv.count > 0); // 응답이 들어온 뒤에는 문항과 익명 여부를 바꾸지 않는다
    var wrap = el('div');
    wrap.appendChild(el('h3', '', sv ? '설문 설정' : '새 설문'));
    var title = textBox(sv && sv.title, 60, '예: 1학기 수업 돌아보기');
    var desc = el('textarea', 'memo');
    desc.maxLength = 1000;
    desc.placeholder = '학생에게 보이는 안내 (선택)';
    desc.value = sv ? sv.desc : '';
    wrap.appendChild(field('제목', title));
    wrap.appendChild(field('안내', desc));
    var due = el('input'); due.type = 'datetime-local'; due.value = sv ? localInput(sv.dueAt) : '';
    wrap.appendChild(field('마감 (선택)', due));
    wrap.appendChild(el('p', 'hint', '비워 두면 "응답 받기"를 끌 때까지 받습니다.'));
    var toggles = el('div', 'list toggles');
    var anon = toggleRow('익명', '켜면 누가 무엇을 골랐는지 기록하지 않습니다. 응답했는지만 봅니다.', sv ? sv.anon : false);
    if (locked) anon.querySelector('.switch').disabled = true;
    var open = toggleRow('응답 받기', '끄면 학생이 더 응답하거나 고칠 수 없습니다.', sv ? sv.switchOn : true);
    var published = toggleRow('게시', '끄면 학생에게 보이지 않습니다.', sv ? sv.published : true);
    toggles.appendChild(anon); toggles.appendChild(open); toggles.appendChild(published);
    wrap.appendChild(toggles);

    wrap.appendChild(el('h4', 'sec', '문항'));
    var qs = (sv ? sv.qs : [{ t: 'one', q: '', o: [], etc: false, req: true }]).map(function (q) { return { t: q.t, q: q.q, o: q.o.join('\n'), etc: q.etc, req: q.req }; });
    var qBox = el('div');
    wrap.appendChild(qBox);
    function drawQs() {
      qBox.textContent = '';
      qs.forEach(function (q, i) {
        var box = el('div', 'slot-edit');

        if (!locked) {
          var tools = el('div', 'q-tools');

          if (qs.length > 1) tools.appendChild(button('mini', '삭제', function () { qs.splice(i, 1); drawQs(); }));
          top.appendChild(tools);
        }
        box.appendChild(top);
        var text = el('input', 'qtext'); text.type = 'text'; text.maxLength = 200; text.value = q.q; text.placeholder = '질문'; text.disabled = locked;
        text.setAttribute('aria-label', (i + 1) + '번 질문');

        box.appendChild(text);
        if (q.t !== 'text') {
          var opts = el('textarea'); opts.value = q.o; opts.placeholder = '선지를 한 줄에 하나씩 적습니다'; opts.disabled = locked;
          opts.setAttribute('aria-label', (i + 1) + '번 선지');
          opts.addEventListener('input', function () { q.o = opts.value; });

          if (!locked) box.appendChild(button('mini', '5단계 척도 넣기', function () { q.o = Q_SCALE.join('\n'); drawQs(); }));

        var line = el('div', 'slot-opts');

        line.appendChild(checkLabel('필수', q.req, locked, function (v) { q.req = v; }));
        box.appendChild(line);
        qBox.appendChild(box);
      });
    }
    function checkLabel(text, on, disabled, onChange) {

      cb.type = 'checkbox'; cb.checked = !!on; cb.disabled = disabled;

    }
    drawQs();
    if (locked) wrap.appendChild(el('p', 'hint', '응답이 들어와서 문항과 익명 여부는 바꿀 수 없습니다.\n제목, 안내, 마감, 응답 받기, 게시만 고칠 수 있습니다.'));

      }).catch(function (err) {
        ok.disabled = false;
        if (err && err.message !== 'expired') msg.textContent = friendly(err);
      });
    });
    pair.appendChild(ok);
    wrap.appendChild(pair);
    if (sv) {

  function toggleRow(title, desc, on, onChange) {

    });
    sw.setAttribute('role', 'switch');
    sw.setAttribute('aria-checked', on ? 'true' : 'false');
    sw.setAttribute('aria-label', title);
    row.appendChild(sw);
    row.isOn = function () { return sw.getAttribute('aria-checked') === 'true'; };
    return row;
  }
  /* 저장·취소·삭제 줄. save()와 remove()는 Promise를 돌려준다 */
  function formActions(wrap, isEdit, save, remove) {
    var msg = el('p', 'msg', '');

  /* ── 평가표 ── */
  function loadGrades() {
    var box = $('tcontent');

    box.textContent = '';
    var wait = el('div', 'loading'); wait.appendChild(el('div', 'spinner')); box.appendChild(wait);
    call('apiTeacherGrades', ttoken, asked).then(function (res) {

  function submitWord(c) {
    if (c.state === 'none') return '미제출';
    if (c.state === 'ontime') return '정시';
    return (c.state === 'late' ? '지각 ' : '허용 ') + c.lateDays + '일';
  }

  function copyText(text) {
    function old() {
      var ta = el('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      return ok ? Promise.resolve() : Promise.reject(new Error('copy'));
    }
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(old);
    return old();
  }

  function drawGrades(res) {
    var box = $('tcontent');
    box.textContent = '';
    if (!res.tasks.length) { box.appendChild(el('p', 'empty', '배점이 있는 과제가 없습니다.\n과제 시트의 배점 칸을 채워 주세요.')); return; }
    if (!res.students.length) { box.appendChild(el('p', 'empty', '이 수업에 배정된 학생이 없습니다.')); return; }
    var many = res.tasks.length > 1;
    var hasNote = res.students.some(function (s) { return s.note; });

    var graded = 0, cellsAll = res.students.length * res.tasks.length;
    res.students.forEach(function (s) { res.tasks.forEach(function (t) { if (s.cells[t.id].mark) graded++; }); });
    var summary = el('div', 'summary');
    var count = el('div');
    count.appendChild(el('strong', '', '채점 ' + graded + '건'));
    count.appendChild(el('span', '', ' / 전체 ' + cellsAll + '건'));
    summary.appendChild(count);
    var tools = el('div', 'tools');
    var copy = button('', '표 복사', function () {
      var lines = [['학번', '이름'].concat(hasNote ? ['비고'] : []).concat([].concat.apply([], res.tasks.map(function (t) {
        return [t.title + ' 제출', t.title + ' 등급', t.title + ' 점수', t.title + ' 확인'];
      }))).concat(many ? ['합계'] : []).join('\t')];
      res.students.forEach(function (s) {
        var sum = 0;
        var row = hasNote ? [s.id, s.name, s.note || ''] : [s.id, s.name];
        res.tasks.forEach(function (t) {
          var c = s.cells[t.id];
          if (c.mark) sum += c.points;
          row.push(submitWord(c), c.mark, c.mark ? c.points : '', c.confirmed ? '확인' : '');
        });
        if (many) row.push(sum);
        lines.push(row.join('\t'));
      });
      copyText(lines.join('\n')).then(function () { copy.textContent = '복사했습니다'; }, function () { copy.textContent = '복사하지 못했습니다'; })
        .then(function () { setTimeout(function () { copy.textContent = '표 복사'; }, 1800); });
    });
    tools.appendChild(copy);
    tools.appendChild(button('', '새로고침', loadGrades));
    summary.appendChild(tools);
    box.appendChild(summary);

    var table = el('table', 'grid');
    var thead = el('thead');
    var top = el('tr'), sub = el('tr');
    var thId = el('th', '', '학번'); thId.rowSpan = 2; top.appendChild(thId);
    var thName = el('th', 'name', '이름'); thName.rowSpan = 2; top.appendChild(thName);
    if (hasNote) { var thNote = el('th', '', '비고'); thNote.rowSpan = 2; top.appendChild(thNote); }
    res.tasks.forEach(function (t) {
      var th = el('th', '', t.title + ' (' + t.max + '점)'); th.colSpan = 4; top.appendChild(th);
      ['제출', '등급', '점수', '확인'].forEach(function (k) { sub.appendChild(el('th', '', k)); });
    });
    if (many) { var thSum = el('th', '', '합계'); thSum.rowSpan = 2; top.appendChild(thSum); }
    thead.appendChild(top); thead.appendChild(sub);
    table.appendChild(thead);

    var tbody = el('tbody');
    var lastCls = null;
    var totals = res.tasks.map(function () { return { sum: 0, n: 0 }; });
    res.students.forEach(function (s) {
      var tr = el('tr', lastCls !== null && lastCls !== s.cls ? 'first' : ''); // 반이 바뀌는 자리에 굵은 선
      lastCls = s.cls;
      tr.appendChild(el('td', '', s.id));
      tr.appendChild(el('td', 'name', s.name));
      if (hasNote) tr.appendChild(el('td', 'none', s.note || ''));
      var sum = 0, any = false;
      res.tasks.forEach(function (t, k) {
        var c = s.cells[t.id];
        var open = function () { openFromGrades(t.id, s.id); };
        var st = el('td', 'go' + (c.state === 'none' ? ' none' : ''));
        st.appendChild(el('span', 'dot lv-' + level(c.state, c.lateDays)));
        st.appendChild(document.createTextNode(submitWord(c)));
        var mk = el('td', 'go' + (c.stale ? ' redo' : (c.mark ? '' : ' none')), c.mark ? c.mark + (c.stale ? ' 재제출' : '') : '–');
        var pt = el('td', 'go' + (c.mark ? '' : ' none'), c.mark ? String(c.points) : '–');
        var cf = el('td', 'go none', c.confirmed ? '✓' : '');
        [st, mk, pt, cf].forEach(function (td) { td.addEventListener('click', open); tr.appendChild(td); });
        if (c.mark) { sum += c.points; any = true; totals[k].sum += c.points; totals[k].n++; }
      });
      if (many) tr.appendChild(el('td', any ? '' : 'none', any ? String(sum) : '–'));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    var tfoot = el('tfoot');
    var fr = el('tr');
    fr.appendChild(el('td', '', ''));
    fr.appendChild(el('td', 'name', '평균'));
    if (hasNote) fr.appendChild(el('td', '', ''));
    totals.forEach(function (x) {
      fr.appendChild(el('td', '', ''));
      fr.appendChild(el('td', '', x.n + '명'));
      fr.appendChild(el('td', '', x.n ? (x.sum / x.n).toFixed(1) : '–'));
      fr.appendChild(el('td', '', ''));
    });
    if (many) fr.appendChild(el('td', '', ''));
    tfoot.appendChild(fr);
    table.appendChild(tfoot);

    var wrap = el('div', 'grid-wrap');
    wrap.appendChild(table);
    box.appendChild(wrap);
    box.appendChild(el('p', 'hint', '칸을 누르면 그 학생의 채점 창이 열립니다.'));
  }
