  function drawRoster() {
    var box = $('tcontent');
    var task = courseById(board.tasks, tTask);
    var scored = task.scale && task.scale.length;
    box.textContent = '';
    if (!roster.length) { box.appendChild(el('p', 'empty', '이 수업에 배정된 학생이 없습니다. 학생 시트를 확인해 주세요.')); return; }

    if (scored) {
      var toggles = el('div', 'list toggles');
      toggles.appendChild(switchRow('점수 공개', '학생에게 점수를 보여 줍니다.', task.scoresOpen, function (on) {
        return call('apiTeacherScoresOpen', ttoken, task.id, on).then(function (res) { must(res); board = res.board; drawRoster(); });
      }));
      box.appendChild(toggles);
    }

    if (task.checks && task.checks.length) return drawChecks(task, box);
    var done = roster.filter(function (s) { return s.state !== 'none'; }).length;
    var summary = el('div', 'summary');
    var count = el('div');
    count.appendChild(el('strong', '', '제출 ' + done + '명'));
    count.appendChild(el('span', '', ' / 전체 ' + roster.length + '명'));
    summary.appendChild(count);
    var tools = el('div', 'tools');
    tools.appendChild(button('', '과제 설정', function () { openTaskForm(task); }));
    tools.appendChild(button('', '새로고침', loadRoster));
    summary.appendChild(tools);
    box.appendChild(summary);

    var info = el('p', 'hint');
    info.style.margin = '0 0 12px';
    info.style.whiteSpace = 'pre-line';
    info.textContent = '정시 마감 ' + (task.due || '없음') + (task.finalDue && task.finalDue !== task.due ? '\n최종 마감 ' + task.finalDue : '');
    if (scored) {
      var redo = roster.filter(function (s) { return s.stale; }).length;
      info.textContent += '\n채점 ' + roster.filter(function (s) { return s.mark; }).length + '명, 학생 확인 ' +
        roster.filter(function (s) { return s.confirmed; }).length + '명' + (redo ? ', 채점 후 다시 제출 ' + redo + '명' : '');
    }
    box.appendChild(info);

    var legend = el('div', 'legend');
    ['0', '1', '2', '3', 'x', 'n'].forEach(function (k) {
      var item = el('span');
      item.appendChild(el('i', 'dot lv-' + k));
      item.appendChild(document.createTextNode(LEVEL_TEXT[k]));
      legend.appendChild(item);
    });
    box.appendChild(legend);

    var order = [], groups = {};
    roster.forEach(function (s) {
      var key = s.grade + '학년 ' + s.cls + '반';
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(s);
    });
    order.forEach(function (key) {
      var list = groups[key];
      var title = el('h3', 'group-title', key);
      title.style.marginTop = '20px';
      title.appendChild(el('span', '', list.filter(function (s) { return s.state !== 'none'; }).length + ' / ' + list.length));
      box.appendChild(title);
      var tiles = el('div', 'tiles');
      list.forEach(function (s) {
        var lv = level(s.state, s.lateDays);
        var tile = button('tile' + (s.away && s.state === 'none' ? ' away' : ''), null, function () { openDetail(s); });
        tile.setAttribute('aria-label', s.num + '번 ' + s.name + ', ' + LEVEL_TEXT[lv] + (s.mark ? ', ' + s.mark : ''));
        var top = el('span', 'tile-top');
        top.appendChild(el('span', 'dot lv-' + lv + (s.allowed && s.state === 'none' ? ' allowed' : '')));
        if (s.mark) top.appendChild(el('span', 'tile-mark' + (s.stale ? ' stale' : ''), s.mark + (s.stale ? ' 재제출' : (s.confirmed ? ' ✓' : ''))));
        tile.appendChild(top);
        tile.appendChild(el('span', 'tile-num', s.num + '번'));
        tile.appendChild(el('span', 'tile-name', s.name));
        if (s.note) tile.appendChild(el('span', 'tile-note', s.note));
        tiles.appendChild(tile);
      });
      box.appendChild(tiles);
    });
  }

  /* 체크 과제: 학생마다 항목 칩을 눌러 '냈음' 표시. 누르는 즉시 저장 */
  function drawChecks(task, box) {
    var items = task.checks, full = function (s) { return s.checks.length === items.length; };
    var summary = el('div', 'summary');
    var count = el('div');
    var strong = el('strong', '');
    count.appendChild(strong);
    count.appendChild(el('span', '', ' / 전체 ' + roster.length + '명'));
    summary.appendChild(count);
    var tools = el('div', 'tools');
    tools.appendChild(button('', '과제 설정', function () { openTaskForm(task); }));
    tools.appendChild(button('', '새로고침', loadRoster));
    summary.appendChild(tools);
    box.appendChild(summary);
    var paintCount = function () { strong.textContent = '모두 낸 학생 ' + roster.filter(full).length + '명'; };
    paintCount();
    box.appendChild(el('p', 'hint', '항목을 누르면 바로 저장됩니다. 다시 누르면 취소돼요. (' + items.join(' · ') + ')'));
    // 항목별로 한 번에: 낸 사람 수
    var per = el('p', 'hint');
    box.appendChild(per);
    var paintPer = function () { per.textContent = items.map(function (c) { return c + ' ' + roster.filter(function (s) { return s.checks.indexOf(c) >= 0; }).length; }).join(' · '); };
    paintPer();
    var order = [], groups = {};
    roster.forEach(function (s) {
      var key = s.grade + '학년 ' + s.cls + '반';
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(s);
    });
    order.forEach(function (key) {
      box.appendChild(el('h3', 'group-title', key));
      var list = el('div', 'list');
      groups[key].forEach(function (s) {
        var row = el('div', 'ck-row');
        var who = el('span', 'nzw'); who.appendChild(el('i', '', s.num)); who.appendChild(document.createTextNode(s.name));
        if (s.note) who.appendChild(el('small', '', s.note));
        row.appendChild(who);
        var cnt = el('span', 'cnt');
        var paintRow = function () { cnt.textContent = s.checks.length + '/' + items.length; cnt.classList.toggle('full', full(s)); };
        var box2 = el('div', 'ck-items');
        items.forEach(function (c) {
          var b = button('dc', null, function () {
            var on = s.checks.indexOf(c) < 0;
            var before = s.checks.slice();
            s.checks = on ? items.filter(function (x) { return x === c || s.checks.indexOf(x) >= 0; }) : s.checks.filter(function (x) { return x !== c; });
            paint(); paintRow(); paintCount(); paintPer();
            s.q = (s.q || Promise.resolve()).then(function () { return call('apiTeacherCheck', ttoken, task.id, s.id, c, on); })
              .then(must).catch(function (err) { s.checks = before; paint(); paintRow(); paintCount(); paintPer(); if (err && err.message !== 'expired') alertSheet(friendly(err)); });
          });
          var paint = function () { var on = s.checks.indexOf(c) >= 0; b.textContent = (on ? '✓ ' : '') + c; b.setAttribute('aria-pressed', on ? 'true' : 'false'); };
          paint();
          box2.appendChild(b);
        });
        row.appendChild(box2);
        row.appendChild(cnt);
        paintRow();
        list.appendChild(row);
      });
      box.appendChild(list);
    });
  }

  /* 교사용 모아보기: 공개 스위치 + 대표 이미지 */
  function drawTeacherGallery() {
    var box = $('tcontent');
    var task = courseById(board.tasks, tTask);
    box.textContent = '';

    function save(pub, names) {
      return call('apiTeacherGallerySet', ttoken, task.id, pub, names).then(function (res) { must(res); board = res.board; drawTeacherGallery(); });
    }
    var toggles = el('div', 'list toggles');
    toggles.appendChild(switchRow('학생에게 공개', '학생 과제 화면에 모아보기 표시', task.gallery,
      function (on) { return save(on, task.galleryNames); }));
    toggles.appendChild(switchRow('이름 표시', '학생 화면에도 이름 표시', task.galleryNames,
      function (on) { return save(task.gallery, on); }));
    box.appendChild(toggles);

    var wrap = el('div');
    box.appendChild(wrap);
    loadGallery(wrap, ttoken, task.id, function (it) {
      var s = courseById(roster, it.sid);
      if (s) openDetail(s);
    });
  }

  /* 학생 한 명: 제출 확인 + 채점 + 메모. 이전/다음으로 넘기며 연속으로 채점할 수 있다 */
  function openDetail(s) {
    var task = courseById(board.tasks, tTask);
    var asked = tTask;
    var wrap = el('div');
    wrap.appendChild(el('h3', '', s.name));
    wrap.appendChild(el('p', '', s.id + ', ' + s.grade + '학년 ' + s.cls + '반 ' + s.num + '번'));
    var body = el('div');
    var wait = el('div', 'loading'); wait.appendChild(el('div', 'spinner')); body.appendChild(wait);
    wrap.appendChild(body);

    var at = roster.indexOf(s);
    var pair = el('div', 'pair');
    var prev = button('btn quiet', '이전', function () { openDetail(roster[at - 1]); });
    var next = button('btn quiet', '다음', function () { openDetail(roster[at + 1]); });
    prev.disabled = at <= 0;
    next.disabled = at < 0 || at >= roster.length - 1;
    pair.appendChild(prev); pair.appendChild(next);
    wrap.appendChild(pair);
    wrap.appendChild(button('link', '닫기', closeSheet));
    openSheet(wrap);
    $('sheetBox').scrollTop = 0;

    function behind() {
      if (asked !== tTask) return;
      if (tView === 'board') drawRoster();
      else if (tView === 'grades') loadGrades();
    }

    call('apiTeacherDetail', ttoken, asked, s.id).then(function (res) {
      must(res);
      body.textContent = '';
      var sub = res.submission;
      var state = el('div', 'state');
      state.appendChild(el('span', 'dot lv-' + (sub ? level(sub.state, sub.lateDays) : 'n')));
      state.appendChild(document.createTextNode((sub ? stateText(sub.state, sub.lateDays) : '미제출') + (sub && sub.alt ? ' (대체과제)' : '')));
      body.appendChild(state);

      if (sub) {
        var dl = el('dl', 'kv');
        dl.style.marginTop = '12px';
        kvRow(dl, '마지막 제출', sub.at);
        if (sub.count > 1) { kvRow(dl, '최초 제출', sub.firstAt); kvRow(dl, '제출 횟수', sub.count + '번'); }
        body.appendChild(dl);
        if (sub.thumb) { var img = el('img', 'preview'); img.alt = s.name + ' 대표 이미지'; img.src = sub.thumb; body.appendChild(img); }
        var extra = sub.files.filter(function (f) { return f.small; });
        if (extra.length) {
          var picks = el('div', 'picks');
          extra.forEach(function (f) {
            var a = el('a', 'pick');
            a.href = f.url; a.target = '_blank'; a.rel = 'noopener';
            a.setAttribute('aria-label', f.name + ' 원본 열기');
            var small = el('img'); small.alt = ''; small.src = f.small;
            a.appendChild(small);
            picks.appendChild(a);
          });
          body.appendChild(picks);
        }
        sub.files.forEach(function (f) { if (f.text) body.appendChild(noteBox(f.slot || '글', f.text)); });
        var list = el('div', 'list');
        var links = sub.files.slice();
        if (sub.zipUrl) links.push({ name: 'ZIP 파일 열기', url: sub.zipUrl });
        if (sub.folderUrl) links.push({ name: '드라이브 폴더 열기', url: sub.folderUrl });
        links.forEach(function (f) {
          var a = el('a', 'row');
          a.href = f.url; a.target = '_blank'; a.rel = 'noopener';
          var text = el('div', 'row-text');
          text.appendChild(el('div', 'row-title', f.name));
          a.appendChild(text);
          a.appendChild(chevron());
          list.appendChild(a);
        });
        body.appendChild(list);
      }

      // 채점
      var g = res.grade;
      if (task.scale && task.scale.length) {
        body.appendChild(el('h4', 'sec', '채점'));
        var grades = el('div', 'grades');
        var info = el('p', 'hint');
        var stale = res.stale;
        var clear = button('link', '채점 지우기', function () { setMark(''); });
        clear.style.margin = '4px 0 0';
        var paint = function () {
          grades.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.mark === g.mark ? 'true' : 'false'); });
          clear.hidden = !g.mark;
          info.textContent = !g.mark ? '아직 채점하지 않았습니다.'
            : stale ? '채점한 뒤에 학생이 다시 제출했습니다. 확인하고 등급을 다시 눌러 주세요.'
            : g.gradedAt + ' 채점' + (g.confirmedAt ? ', 학생 확인 ' + g.confirmedAt : (task.scoresOpen ? ', 학생 확인 전' : ', 점수 비공개 상태'));
        };
        var setMark = function (mark) {
          grades.classList.add('busy');
          call('apiTeacherGrade', ttoken, asked, s.id, mark).then(function (r) {
            must(r);
            g = r.grade;
            stale = false;
            s.mark = g.mark; s.points = g.points; s.confirmed = !!g.confirmedAt; s.stale = false;
            paint(); behind();
          }).catch(function (err) { if (err && err.known) info.textContent = err.message; })
            .then(function () { grades.classList.remove('busy'); });
        };
        task.scale.forEach(function (x) {
          var b = button('', null, function () { setMark(x.g); });
          b.dataset.mark = x.g;
          b.appendChild(document.createTextNode(x.g));
          b.appendChild(el('small', '', x.p + '점'));
          grades.appendChild(b);
        });
        body.appendChild(grades);
        body.appendChild(info);
        body.appendChild(clear);
        paint();
      }

      // 메모
      body.appendChild(el('h4', 'sec', '학생에게 보이는 메모'));
      var memo = el('textarea', 'memo');
      memo.maxLength = 500;
      memo.placeholder = '예: 세계관 설명을 보충해 주세요.';
      memo.value = g.memo || '';
      body.appendChild(memo);
      body.appendChild(el('h4', 'sec', '선생님만 보는 메모'));
      var priv = el('textarea', 'memo');
      priv.maxLength = 1000;
      priv.placeholder = '학생에게 보이지 않습니다.';
      priv.value = g.priv || '';
      body.appendChild(priv);
      var saved = el('p', 'hint', '');
      var lastSaved = memo.value + '\u0001' + priv.value;
      // 버튼을 누르지 않아도, 메모 칸에서 손을 떼면(다른 곳을 누르면) 바뀐 내용을 자동으로 저장한다
      var storeMemo = function () {
        var now = memo.value + '\u0001' + priv.value;
        if (now === lastSaved) return;
        lastSaved = now;
        saveMemo.disabled = true;
        saved.textContent = '저장하는 중';
        call('apiTeacherMemo', ttoken, asked, s.id, memo.value, priv.value).then(function (r) {
          must(r);
          s.hasMemo = !!r.grade.memo;
          saved.textContent = '저장했습니다.';
        }).catch(function () { lastSaved = ''; saved.textContent = '저장하지 못했습니다. 메모 저장을 다시 눌러 주세요.'; })
          .then(function () { saveMemo.disabled = false; });
      };
      var saveMemo = button('mini', '메모 저장', function () {
        if (memo.value + '\u0001' + priv.value === lastSaved) { saved.textContent = '이미 저장되어 있습니다.'; return; }
        storeMemo();
      });
      memo.addEventListener('blur', storeMemo);
      priv.addEventListener('blur', storeMemo);
      memo.addEventListener('input', function () { saved.textContent = ''; });
      priv.addEventListener('input', function () { saved.textContent = ''; });
      body.appendChild(saveMemo);
      body.appendChild(saved);

      // 마감 후 제출 허용
      if (task.hasSlots) {
        s.allowed = res.allowed;
        var allow = button('btn quiet', '', function () {
          allow.disabled = true;
          call('apiTeacherAllow', ttoken, asked, s.id, !s.allowed).then(function (r) {
            must(r);
            s.allowed = r.allowed;
            label();
            behind();
          }).catch(function () {}).then(function () { allow.disabled = false; });
        });
        var tip = el('p', 'hint');
        var label = function () {
          allow.textContent = s.allowed ? '제출·수정 허용 끄기' : '제출·수정 허용';
          tip.textContent = s.allowed ? '마감, 채점 뒤에도 제출과 수정이 열려 있습니다.' : '마감이나 채점 뒤에 이 학생만 다시 받습니다.';
        };
        label();
        body.appendChild(allow);
        body.appendChild(tip);
      }

      // 특이사항: 현장실습·취업은 평가 과제를 대체과제로 낸다
      body.appendChild(el('h4', 'sec', '특이사항'));
      var statusWrap = el('div', 'field');
      statusWrap.style.margin = '0';
      var status = el('select');
      status.setAttribute('aria-label', '특이사항');
      [''].concat(res.statusList || []).forEach(function (v) { var o = el('option', '', v || '없음'); o.value = v; status.appendChild(o); });
      status.value = res.status || '';
      var statusTip = el('p', 'hint');
      var statusText = function (v) {
        return !v ? '수업을 따로 챙겨야 하는 학생이면 골라 주세요.'
          : (res.altStatus || []).indexOf(v) >= 0 ? '평가 과제를 대체과제로 냅니다.\n파일 형식과 개수 제한이 없습니다.'
          : '표시만 하고 제출 방식은 그대로입니다.';
      };
      statusTip.textContent = statusText(status.value);
      status.addEventListener('change', function () {
        status.disabled = true;
        call('apiTeacherSetStatus', ttoken, s.id, status.value).then(function (r) {
          must(r);
          res.status = r.status; s.note = r.note; s.away = r.away;
          statusTip.textContent = statusText(r.status);
          behind();
        }).catch(function (err) {
          status.value = res.status || '';
          if (err && err.message !== 'expired') statusTip.textContent = friendly(err);
        }).then(function () { status.disabled = false; });
      });
      statusWrap.appendChild(status);
      body.appendChild(statusWrap);
      body.appendChild(statusTip);

      // 로그인 상태와 PIN 초기화 (PIN 숫자 자체는 저장되지 않아 볼 수 없다)
      body.appendChild(el('h4', 'sec', '로그인'));
      var pinInfo = el('p', 'hint');
      pinInfo.style.margin = '0';
      var PIN_TEXT = { set: 'PIN을 만들어 쓰고 있습니다.', none: '아직 PIN을 만들지 않았습니다.', locked: '여러 번 틀려 잠겨 있습니다.' };
      pinInfo.textContent = PIN_TEXT[res.pin] || '';
      body.appendChild(pinInfo);
      if (res.pin !== 'none') {
        var armed = false;
        var reset = button('mini', 'PIN 초기화', function () {
          if (!armed) { armed = true; reset.textContent = '한 번 더 누르면 초기화합니다'; return; } // 실수로 누르는 것 방지
          reset.disabled = true;
          call('apiTeacherResetPin', ttoken, s.id).then(function (r) {
            must(r);
            pinInfo.textContent = '초기화했습니다. 학생이 다시 접속하면 새 PIN을 만듭니다.';
            reset.hidden = true;
          }).catch(function (err) {
            reset.disabled = false; armed = false; reset.textContent = 'PIN 초기화';
            if (err && err.message !== 'expired') pinInfo.textContent = friendly(err);
          });
        });
        body.appendChild(reset);
      }
    }).catch(function (err) {
      if (err && err.message === 'expired') return;
      body.textContent = '';
      body.appendChild(el('p', 'empty', friendly(err)));
    });
  }

  /* ── 시작 ── */
  ttoken = recall(sessionStorage, TTOKEN_KEY);
  token = recall(sessionStorage, TOKEN_KEY);
  if (ttoken) {
    call('apiTeacherBoard', ttoken).then(function (res) {
      if (res && res.ok) startTeacher(res.board);
      else { ttoken = null; keep(sessionStorage, TTOKEN_KEY, null); showAuth(); }
    }).catch(showAuth);
  } else if (token) {
    call('apiGetHome', token).then(function (res) {
      if (res && res.ok) start(res.home);
      else { token = null; keep(sessionStorage, TOKEN_KEY, null); showAuth(); }
    }).catch(showAuth);
  } else {
    showAuth();
  }
})();
</script>
</body>
</html>
